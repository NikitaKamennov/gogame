<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Шашки</title>
<style>
:root{
  --bg:#0f1216;
  --panel:#151a21;
  --text:#e5e7eb;
  --muted:#9aa3af;
  --accent:#60a5fa;
  --ok:#22c55e;
  --err:#ef4444;
  --br:#242b35;
  --shadow:0 10px 25px rgba(0,0,0,.35);
  --sq-dark:#1f2937;
  --sq-light:#374151;
  --sq-target:#22c55e66;
  --sq-legal:#60a5fa55;
  --sq-last:#f59e0b66;
  --btn:#111827;
  --btn2:#1f2937;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Ubuntu,Arial,"Noto Sans";-webkit-tap-highlight-color: transparent;}
.wrap{max-width:960px;margin:16px auto;padding:12px}
.header{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.title{font-weight:800;font-size:20px}
.hud{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted)}
.hud strong{color:var(--text)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:var(--btn);color:#fff;border:1px solid var(--br);
  padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;
}
.btn.primary{background:var(--btn2);border-color:#374151}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.panel{
  background:var(--panel);border:1px solid var(--br);border-radius:14px;
  box-shadow:var(--shadow);padding:12px;
}
.layout{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:820px){
  .layout{grid-template-columns:1fr 320px}
}
/* Доска */
.board-wrap{display:flex;justify-content:center}
.board{
  width:min(96vw, 520px);
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  grid-template-rows:repeat(8, 1fr);
  gap:0; border-radius:12px; overflow:hidden;
  border:1px solid var(--br);
  position:relative; background:#0b0f15;
}
.square{
  position:relative; user-select:none;
  display:flex; align-items:center; justify-content:center;
  font-size: clamp(28px, 9vw, 56px);
  line-height:1;
}
.square.dark{ background:var(--sq-dark) }
.square.light{ background:var(--sq-light) }
/* метки координат */
.coord{
  position:absolute; left:6px; bottom:4px; font-size:10px; color:#cbd5e1; opacity:.6;
  pointer-events:none;
}
.square.mark-legal::after{
  content:''; position:absolute; width:18%; height:18%; border-radius:50%;
  background:var(--sq-legal);
}
.square.mark-target{ outline:3px solid var(--sq-target); outline-offset:-3px }
.square.mark-last{ box-shadow: inset 0 0 0 3px var(--sq-last) }

.piece{
  position:relative;
  cursor:grab;
  touch-action:none;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,.45));

  /* Новое: заставляем элемент занять всю клетку и центрировать кружок */
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.piece:active{ cursor:grabbing }
.dragGhost{
  position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
  width:64px; height:64px;
  filter: drop-shadow(0 12px 22px rgba(0,0,0,.6));
}
/* Внешний вид шашек */
.checker{
  width:70%; height:70%;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:800;
  letter-spacing:.5px;
}
.checker.white{ background:linear-gradient(#e5e7eb,#cbd5e1); color:#0b0f15; border:2px solid #9ca3af; }
.checker.black{ background:linear-gradient(#0b0f15,#1f2937); color:#f8fafc; border:2px solid #111827; }
.checker .k{ font-size: 0.55em; background:rgba(255,255,255,.08); padding:.14em .34em; border-radius:.4em; border:1px solid rgba(255,255,255,.18) }

/* Панель справа */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.select{
  background:#0e131a;border:1px solid var(--br);border-radius:10px;color:#fff;padding:8px 10px;
}
.label{color:var(--muted);font-size:14px}
.stat{color:var(--muted);font-size:14px}
.stat strong{color:var(--text)}
/* Статус */
.status{margin-top:8px;color:var(--muted);font-size:14px}
/* Модалка */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10000;padding:12px}
.modal.open{display:flex}
.modal-content{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--br);
  border-radius:14px;box-shadow:var(--shadow);padding:16px;text-align:center;
}
.modal h3{margin:0 0 8px}
.modal p{margin:0 0 12px;color:var(--muted)}
.footer-note{color:var(--muted);font-size:12px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">Шашки</div>
    <div class="hud">
      <div>Сложность: <strong id="hudDifficulty">Новичок</strong></div>
      <div>Вы: <strong id="hudSide">Белые</strong></div>
      <div>Ход: <strong id="hudTurn">Белые</strong></div>
      <div class="stat">Счёт (тек. сложн.): <strong id="hudScore">0/0/0</strong></div>
    </div>
    <div class="btns">
      <button id="btnNew" class="btn primary">Новая игра</button>
      <button id="btnUndo" class="btn">Отменить ход</button>
      <button id="btnSwitch" class="btn">Сменить цвет</button>
    </div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="Шашечная доска 8 на 8"></div>
      </div>
      <div id="status" class="status">Перетащите свою шашку. Доступные финальные клетки подсветятся.</div>
    </div>
    <div class="panel">
      <h3 style="margin:0 0 8px">Параметры</h3>
      <div class="row">
        <span class="label">Сложность:</span>
        <select id="selDifficulty" class="select" aria-label="Выбор сложности">
          <option value="easy">Новичок</option>
          <option value="med">Бывалый</option>
          <option value="mae">Маэстро</option>
        </select>
      </div>
      <div class="row">
        <span class="label">Статистика (по сложности):</span>
        <div class="stat">Побед: <strong id="stWins">0</strong></div>
        <div class="stat">Ничьих: <strong id="stDraws">0</strong></div>
        <div class="stat">Поражений: <strong id="stLosses">0</strong></div>
      </div>
      <div class="row">
        <button id="btnResetStats" class="btn">Сбросить статистику</button>
      </div>
      <div class="footer-note">Разработано по заказу <strong>Каменнова Максима</strong></div>
    </div>
  </div>
</div>

<!-- Модалка результата -->
<div id="modalGame" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <h3 id="modalTitle">Игра окончена</h3>
    <p id="modalText">Результат: —</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:6px">
      <button id="modalOk" class="btn primary">Новая игра</button>
    </div>
  </div>
</div>

<script>
/* =========================
Локальный движок русских шашек (8x8)
- обязательный бой, фильтр «максимальный бой»
- мультибой (DFS), у дамки — "летящая" логика
- промоция по пути с немедленным продолжением как дамка
========================= */

const DIFF_LABEL = { easy:'Новичок', med:'Бывалый', mae:'Маэстро' };
const LS_STATE = 'draughts_state_v1';
const LS_SCORE = 'draughts_score_v1';

let game;
let playerSide = 'w'; // w — белые снизу, b — чёрные сверху
let difficulty = 'easy';
let lastMove = null;
let score = loadScore();

let aiBusy = false;
let maeCancel = false;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const btnNew = document.getElementById('btnNew');
const btnUndo = document.getElementById('btnUndo');
const btnSwitch = document.getElementById('btnSwitch');
const selDifficulty = document.getElementById('selDifficulty');
const hudDifficulty = document.getElementById('hudDifficulty');
const hudSide = document.getElementById('hudSide');
const hudTurn = document.getElementById('hudTurn');
const hudScore = document.getElementById('hudScore');
const stWins = document.getElementById('stWins');
const stDraws = document.getElementById('stDraws');
const stLosses = document.getElementById('stLosses');
const btnResetStats = document.getElementById('btnResetStats');
const modalGame = document.getElementById('modalGame');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalOk = document.getElementById('modalOk');

document.addEventListener('DOMContentLoaded', () => {
  buildBoardUI();
  wireUI();
  ensureSquareBoard();
  initGame();
});
window.addEventListener('resize', ensureSquareBoard);
function ensureSquareBoard(){
  const w = Math.max(0, boardEl.getBoundingClientRect().width);
  boardEl.style.height = w + 'px';
}

/* ==== Движок ==== */
class Draughts {
  constructor(){
    this.reset();
  }
  reset(){
    // '.' — пусто, 'w'/'b' — шашка, 'W'/'B' — дамка
    this.boardArr = Array.from({length:8}, () => Array(8).fill('.'));
    // размещаем на тёмных клетках: (r+c)%2==1
    for (let r=0;r<3;r++){
      for (let c=0;c<8;c++){
        if ((r+c)%2===1) this.boardArr[r][c] = 'b';
      }
    }
    for (let r=5;r<8;r++){
      for (let c=0;c<8;c++){
        if ((r+c)%2===1) this.boardArr[r][c] = 'w';
      }
    }
    this.turnColor = 'w';
    this.history = []; // для undo: полные снимки
    this.halfmoveNoCapture = 0; // для потенциальной ничьей (не используем строго)
    this.fullmove = 1;
  }
  cloneBoard(){
    return this.boardArr.map(row => row.slice());
  }
  load(str){
    try{
      const [rows, turn] = str.split(' ');
      const parts = rows.split('/');
      if (parts.length !== 8) return false;
      const b = parts.map(r => r.split(''));
      if (!b.every(row => row.length===8)) return false;
      this.boardArr = b;
      this.turnColor = (turn==='b') ? 'b' : 'w';
      this.history = [];
      this.halfmoveNoCapture = 0;
      this.fullmove = 1;
      return true;
    } catch { return false; }
  }
  save(){
    const rows = this.boardArr.map(r => r.join('')).join('/');
    return rows + ' ' + this.turn();
  }
  turn(){ return this.turnColor; }
  opposite(c){ return c==='w'?'b':'w'; }
  get(sq){
    const {r,c} = algebraicToRC(sq);
    const ch = this.boardArr[r][c];
    if (ch === '.') return null;
    const color = (ch.toLowerCase()==='w') ? 'w' : 'b';
    const king = (ch === 'W' || ch === 'B');
    return { color, king };
  }
  pieceAtRC(r,c){
    const ch = this.boardArr[r][c];
    if (ch === '.') return null;
    const color = (ch.toLowerCase()==='w') ? 'w' : 'b';
    const king = (ch === 'W' || ch === 'B');
    return { color, king, ch };
  }
  setAt(r,c,ch){ this.boardArr[r][c] = ch; }

  // ==== Ходы ====
  moves(opts={}){
    // Генерируем все допустимые ходы текущего игрока, с учётом «максимального боя»
    const color = this.turn();
    const captureMoves = [];
    const normalMoves = [];
    for (let r=0;r<8;r++){
      for (let c=0;c<8;c++){
        const p = this.pieceAtRC(r,c);
        if (!p || p.color!==color) continue;
        const from = rcToAlgebraic(r,c);
        // Каптюры (DFS)
        const caps = this.generateCapturesFrom(r,c,p);
        for (const mv of caps){
          captureMoves.push({ from, to: rcToAlgebraic(mv.end.r, mv.end.c), steps: mv.steps.map(x=>rcToAlgebraic(x.r,x.c)), captures: mv.captures.map(x=>rcToAlgebraic(x.r,x.c)), count: mv.count, becameKing: mv.becameKing });
        }
        if (caps.length===0){
          // Обычные ходы только если вообще нет взятий на доске (мы решим позже)
          const norms = this.generateQuietMovesFrom(r,c,p);
          for (const e of norms){
            normalMoves.push({ from, to: rcToAlgebraic(e.r,e.c), steps:[rcToAlgebraic(e.r,e.c)], captures:[], count:0, becameKing: e.becameKing });
          }
        }
      }
    }
    if (captureMoves.length>0){
      const maxTake = Math.max(...captureMoves.map(m=>m.count));
      const filtered = captureMoves.filter(m=>m.count===maxTake);
      if (opts.square){
        return filtered.filter(m=>m.from===opts.square);
      }
      return filtered;
    } else {
      if (opts.square){
        return normalMoves.filter(m=>m.from===opts.square);
      }
      return normalMoves;
    }
  }

  generateQuietMovesFrom(r,c,p){
    const res = [];
    if (p.king){
      const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
      for (const [dr,dc] of dirs){
        let rr=r+dr, cc=c+dc;
        while (inBounds(rr,cc) && this.boardArr[rr][cc]==='.'){
          const becameKing = false; // уже дамка
          res.push({r:rr,c:cc,becameKing});
          rr+=dr; cc+=dc;
        }
      }
    } else {
      const dir = (p.color==='w') ? -1 : 1;
      for (const dc of [-1,1]){
        const rr = r+dir, cc = c+dc;
        if (inBounds(rr,cc) && this.boardArr[rr][cc]==='.'){
          const becameKing = (p.color==='w' && rr===0) || (p.color==='b' && rr===7);
          res.push({r:rr,c:cc,becameKing});
        }
      }
    }
    return res;
  }

  generateCapturesFrom(r,c,p){
    // Возвращает массив вариантов: { steps:[{r,c},...], captures:[{r,c}...], end:{r,c}, count, becameKing:boolean }
    const board = this.boardArr;
    const color = p.color;
    const opp = (color==='w')?'b':'w';
    const out = [];

    const self = this;
    function dfsMan(sr,sc,isKing, steps, captures, becameKingFlag){
      let any = false;
      if (isKing){
        // переключаемся на логику дамки
        return dfsKing(sr,sc, steps, captures, becameKingFlag);
      }
      const deltas = [[-1,-1],[-1,1],[1,-1],[1,1]];
      for (const [dr,dc] of deltas){
        const r1=sr+dr, c1=sc+dc;
        const r2=sr+2*dr, c2=sc+2*dc;
        if (!inBounds(r1,c1) || !inBounds(r2,c2)) continue;
        const mid = board[r1][c1];
        if (mid==='.' || self.colorOf(mid)!==opp) continue;
        if (board[r2][c2]!=='.') continue;
        // выполнить шаг
        any = true;
        const prevFrom = board[sr][sc];
        const prevMid = board[r1][c1];
        board[sr][sc]='.';
        board[r1][c1]='.'; // снять побитую
        // двигаем шашку
        let ch = prevFrom;
        let becameKingNow = false;
        if ((color==='w' && r2===0) || (color==='b' && r2===7)){
          if (ch.toLowerCase()===ch){ // была простой
            ch = (color==='w') ? 'W' : 'B';
            becameKingNow = true;
          }
        }
        board[r2][c2]=ch;

        const nextIsKing = (ch==='W'||ch==='B');
        const newSteps = steps.concat([{r:r2,c:c2}]);
        const newCaps = captures.concat([{r:r1,c:c1}]);

        const cont = dfsMan(r2,c2,nextIsKing, newSteps, newCaps, becameKingFlag || becameKingNow);
        if (cont===0){
          // финал
          out.push({
            steps:newSteps, captures:newCaps, end:{r:r2,c:c2},
            count:newCaps.length, becameKing:(becameKingFlag||becameKingNow)
          });
        }

        // откат
        board[r2][c2]='.';
        board[r1][c1]=prevMid;
        board[sr][sc]=prevFrom;
      }
      return any ? 1 : 0;
    }

    function dfsKing(sr,sc, steps, captures, becameKingFlag){
      let any=0;
      const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
      for (const [dr,dc] of dirs){
        let rr=sr+dr, cc=sc+dc;
        // до встречи соперника — только пустые
        while (inBounds(rr,cc) && board[rr][cc]==='.') { rr+=dr; cc+=dc; }
        if (!inBounds(rr,cc)) continue;
        const hit = board[rr][cc];
        if (hit==='.' || self.colorOf(hit)!==opp) continue;
        // после соперника должны быть пустые посадки
        let lr=rr+dr, lc=cc+dc;
        while (inBounds(lr,lc) && board[lr][lc]==='.'){
          // симулируем посадку на (lr,lc)
          any=1;
          const prevFrom = board[sr][sc];
          const prevMid = board[rr][cc];
          board[sr][sc]='.';
          board[rr][cc]='.'; // снять побитую
          board[lr][lc]=prevFrom;

          const newSteps = steps.concat([{r:lr,c:lc}]);
          const newCaps = captures.concat([{r:rr,c:cc}]);
          const cont = dfsKing(lr,lc, newSteps, newCaps, becameKingFlag);

          if (cont===0){
            out.push({
              steps:newSteps, captures:newCaps, end:{r:lr,c:lc},
              count:newCaps.length, becameKing:becameKingFlag
            });
          }

          // откат
          board[lr][lc]='.';
          board[rr][cc]=prevMid;
          board[sr][sc]=prevFrom;

          lr+=dr; lc+=dc;
        }
      }
      return any;
    }

    const startIsKing = p.king;
    // временно убираем стартовую шашку и кладём обратно внутри DFS — не обязательно, оставим как есть
    dfsMan(r,c,startIsKing, [], [], false);
    return out;
  }

  colorOf(ch){ return (ch.toLowerCase()==='w') ? 'w' : 'b'; }

  move(m){
    // m: {from,to} — ищем среди допустимых ходов, применяем
    const legal = this.moves();
    const cand = legal.find(x => x.from===m.from && x.to===m.to);
    if (!cand) return null;
    this.applyMove(cand, true);
    return cand;
  }

  applyMove(mv, recordHistory){
    if (recordHistory){
      this.history.push({
        board: this.cloneBoard(),
        turn: this.turnColor,
        halfmove: this.halfmoveNoCapture,
        fullmove: this.fullmove,
        lastMove: lastMove ? {...lastMove} : null
      });
    }
    const {r:fr,c:fc} = algebraicToRC(mv.from);
    const ch0 = this.boardArr[fr][fc];
    let ch = ch0;
    // пошагово выполняем маршрут: удаляем побитых, шагаем
    this.boardArr[fr][fc]='.';
    let curR = fr, curC = fc;
    for (let i=0;i<mv.steps.length;i++){
      const stepSq = mv.steps[i];
      // если этот шаг сопровождался побитием — удалим соответствующую фигуру
      if (i < mv.captures.length){
        const {r:cr,c:cc} = algebraicToRC(mv.captures[i]);
        this.boardArr[cr][cc]='.';
      }
      // если на этом шаге впервые зашли в дамочную как простая — превратим
      const destRC = algebraicToRC(stepSq);
      if ((this.colorOf(ch)==='w' && ch==='w' && destRC.r===0) ||
          (this.colorOf(ch)==='b' && ch==='b' && destRC.r===7)){
        ch = (this.colorOf(ch)==='w') ? 'W' : 'B';
      }
      curR = destRC.r; curC = destRC.c;
    }
    this.boardArr[curR][curC] = ch;

    const wasCapture = mv.captures.length > 0;
    this.halfmoveNoCapture = wasCapture ? 0 : (this.halfmoveNoCapture + 1);

    // смена хода
    this.turnColor = this.opposite(this.turnColor);
    if (this.turnColor === 'w') this.fullmove += 1;
  }

  undo(){
    if (this.history.length===0) return false;
    const st = this.history.pop();
    this.boardArr = st.board;
    this.turnColor = st.turn;
    this.halfmoveNoCapture = st.halfmove;
    this.fullmove = st.fullmove;
    lastMove = st.lastMove;
    return true;
  }

  hasAnyMoves(color){
    const keep = this.turnColor;
    this.turnColor = color;
    const ms = this.moves();
    this.turnColor = keep;
    return ms.length>0;
  }

  winnerIfOver(){
    // проигрыш стороны, у которой нет ходов, или у которой нет фигур
    const turn = this.turn();
    if (!this.hasAnyMoves(turn)) return this.opposite(turn);
    const counts = this.countPieces();
    if (counts.w===0) return 'b';
    if (counts.b===0) return 'w';
    return null;
  }

  countPieces(){
    let w=0,b=0;
    for (let r=0;r<8;r++) for (let c=0;c<8;c++){
      const ch = this.boardArr[r][c];
      if (ch==='.') continue;
      if (this.colorOf(ch)==='w') w++; else b++;
    }
    return {w,b};
  }
}

/* ==== Оценка и ИИ ==== */
function isMobile(){ return /Mobi|Android/i.test(navigator.userAgent) || (window.innerWidth < 820); }
const VAL = { man:100, king:300 };
function evaluateFor(game, color){
  // Материал
  let sc = 0;
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    const ch = game.boardArr[r][c];
    if (ch==='.') continue;
    const me = game.colorOf(ch)===color ? 1 : -1;
    const isKing = (ch==='W'||ch==='B');
    const v = isKing ? VAL.king : VAL.man;
    sc += me * v;
    // продвижение простых (мотивация)
    if (!isKing){
      const adv = (game.colorOf(ch)==='w') ? (7 - r) : r;
      sc += me * adv * 4;
      // центр
      const centerBonus = (c>=2 && c<=5) ? 4 : 0;
      sc += me * centerBonus;
    } else {
      // дамка в центре
      const centerBonus = (r>=2 && r<=5 && c>=2 && c<=5) ? 6 : 0;
      sc += me * centerBonus;
    }
  }
  // мобильность
  const keep = game.turnColor;
  game.turnColor = color;
  const myMoves = game.moves().length;
  game.turnColor = game.opposite(color);
  const oppMoves = game.moves().length;
  game.turnColor = keep;
  sc += (myMoves - oppMoves) * 2;
  return sc;
}
function evalNegamax(game, maxColor){
  // если сейчас ход maxColor — оценка как есть, иначе смена знака
  const e = evaluateFor(game, maxColor);
  return (game.turn()===maxColor) ? e : -e;
}

function computeAIMove(){
  if (difficulty==='easy'){
    const moves = game.moves();
    if (!moves.length) return null;
    return moves[Math.floor(Math.random()*moves.length)];
  }
  if (difficulty==='med'){
    return pickBest1Ply();
  }
  if (difficulty==='mae'){
    return null; // асинхронно через maestro()
  }
  return null;
}

function pickBest1Ply(){
  const moves = game.moves();
  if (!moves.length) return null;
  let best = null, bestScore = -Infinity;
  const maxColor = game.turn();
  for (const mv of moves){
    game.applyMove(mv, true);
    const sc = evalNegamax(game, maxColor)
      + (mv.count*25) + (mv.becameKing?30:0);
    game.undo();
    if (sc > bestScore){
      bestScore = sc;
      best = mv;
    }
  }
  return best;
}

// Maestro: ID-AB с ограничением времени
const MAE_CONF = {
  timeMs: isMobile() ? 3000 : 5000,
  maxDepth: isMobile() ? 6 : 8
};
function orderMoves(moves){
  // взятия вперед, длиннее бои, превращение
  return [...moves].sort((a,b)=>{
    if ((b.count||0)!==(a.count||0)) return (b.count||0)-(a.count||0);
    if ((b.becameKing?1:0)!==(a.becameKing?1:0)) return (b.becameKing?1:0)-(a.becameKing?1:0);
    return 0;
  });
}
function aiMoveMaestro(){
  if (aiBusy) return;
  aiBusy = true; maeCancel=false;
  setStatus('Маэстро думает...');
  const start = Date.now();
  const maxColor = game.turn();
  let best = null;
  for (let depth=1; depth<=MAE_CONF.maxDepth; depth++){
    const leftMs = MAE_CONF.timeMs - (Date.now()-start);
    if (leftMs<=0 || maeCancel) break;
    const res = searchRoot(depth, maxColor, start);
    if (res.cancelled) break;
    best = res.bestMove || best;
  }
  aiBusy = false;
  if (!best){
    if (!checkGameOver()) endAsDraw('Нет ходов.');
    return;
  }
  game.applyMove(best, true);
  lastMove = { from: best.from, to: best.to };
  saveState();
  renderAll();
  checkGameOver();
}
function searchRoot(depth, maxColor, startTs){
  let bestMove = null, bestVal = -1e9;
  const alphaStart = -1e9, betaStart = 1e9;
  const rootMoves = orderMoves(game.moves());
  for (const mv of rootMoves){
    if ((Date.now()-startTs)>=MAE_CONF.timeMs || maeCancel) return {cancelled:true, bestMove};
    game.applyMove(mv, true);
    const v = -negamax(depth-1, -betaStart, -alphaStart, maxColor, startTs);
    game.undo();
    if (v > bestVal){
      bestVal = v;
      bestMove = mv;
    }
  }
  return {cancelled:false, bestMove, bestVal};
}
function negamax(depth, alpha, beta, maxColor, startTs){
  if ((Date.now()-startTs)>=MAE_CONF.timeMs || maeCancel) return 0;
  if (depth===0) return evalNegamax(game, maxColor);

  const moves = orderMoves(game.moves());
  if (moves.length===0){
    // нет ходов — поражение текущего, выгодно оппоненту
    const sign = (game.turn()===maxColor)? -1 : 1;
    return sign * -999999 + (depth); // предпочитаем быстрые выигрыши
  }
  let val = -1e9;
  for (const mv of moves){
    game.applyMove(mv, true);
    const sc = -negamax(depth-1, -beta, -alpha, maxColor, startTs);
    game.undo();
    if (sc > val) val = sc;
    if (val > alpha) alpha = val;
    if (alpha >= beta) break; // отсечение
  }
  return val;
}

/* ==== Приложение / UI ==== */
function initGame(){
  game = new Draughts();
  restoreOrNew();
  renderAll();
  setStatus('Готово. Ваш ход.');
  if (game.turn() !== playerSide) aiMoveWithDelay();
}

function aiMoveWithDelay(){
  setStatus('Ход компьютера…');
  if (difficulty==='mae'){
    setTimeout(()=>aiMoveMaestro(), 50);
    return;
  }
  const delay = (difficulty==='easy') ? 250 : 320;
  setTimeout(()=>{
    const mv = computeAIMove();
    if (!mv){
      if (!checkGameOver()) endAsDraw('Нет ходов.');
      return;
    }
    game.applyMove(mv, true);
    lastMove = { from: mv.from, to: mv.to };
    saveState();
    renderAll();
    checkGameOver();
  }, delay);
}

function checkGameOver(){
  const winner = game.winnerIfOver();
  if (!winner) return false;
  const playerWon = (winner===playerSide);
  updateScore(playerWon?'w':'l');
  showResultModal(playerWon ? 'У соперника нет ходов или фигур. Вы победили!' : 'У вас нет ходов или фигур. Вы проиграли.');
  return true;
}

function endAsDraw(text){
  updateScore('d');
  showResultModal(text||'Ничья.');
}

function updateScore(res){
  const s = score[difficulty] || (score[difficulty] = { w:0, d:0, l:0 });
  if (res === 'w') s.w++;
  else if (res === 'd') s.d++;
  else s.l++;
  saveScore();
  renderHUD();
}
function showResultModal(text){
  modalTitle.textContent = 'Игра окончена';
  modalText.textContent = text;
  modalGame.classList.add('open');
}

/* ==== Сохранение ==== */
function saveState(){
  if (!game) return;
  const state = {
    board: game.save(),
    playerSide,
    difficulty,
    lastMove
  };
  localStorage.setItem(LS_STATE, JSON.stringify(state));
}
function restoreOrNew(){
  try{
    const raw = localStorage.getItem(LS_STATE);
    if (!raw){ game.reset(); return; }
    const st = JSON.parse(raw);
    if (st && st.board){
      game.load(st.board);
      playerSide = st.playerSide || 'w';
      difficulty = (['med','mae'].includes(st.difficulty)) ? st.difficulty : 'easy';
      lastMove = st.lastMove || null;
    } else {
      game.reset();
    }
  } catch { game.reset(); }
}
function loadScore(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_SCORE) || '{}');
    if (s && s.easy && s.med){
      if (!s.mae) s.mae = {w:0,d:0,l:0};
      return s;
    }
  } catch {}
  return { easy:{w:0,d:0,l:0}, med:{w:0,d:0,l:0}, mae:{w:0,d:0,l:0} };
}
function saveScore(){
  localStorage.setItem(LS_SCORE, JSON.stringify(score));
}

/* ==== HUD/BOARD ==== */
function renderAll(){
  renderBoard();
  renderHUD();
}
function renderHUD(){
  hudDifficulty.textContent = DIFF_LABEL[difficulty];
  hudSide.textContent = (playerSide==='w'?'Белые':'Чёрные');
  hudTurn.textContent = (game.turn()==='w'?'Белые':'Чёрные');
  const s = score[difficulty] || {w:0,d:0,l:0};
  stWins.textContent = s.w; stDraws.textContent = s.d; stLosses.textContent = s.l;
  hudScore.textContent = `${s.w}/${s.d}/${s.l}`;
  selDifficulty.value = difficulty;
}

let squareRefs = [];
function buildBoardUI(){
  boardEl.innerHTML = '';
  squareRefs = [];
  for (let r=0;r<8;r++){
    const row = [];
    for (let c=0;c<8;c++){
      const sq = document.createElement('div');
      sq.className = 'square ' + (((r+c)%2===0)?'light':'dark');
      sq.dataset.rc = `${r},${c}`;
      boardEl.appendChild(sq);
      row.push(sq);
    }
    squareRefs.push(row);
  }
}
function getSquareEl(r,c){ return squareRefs[r][c]; }

function renderBoard(){
  clearBoardMarks();
  for (let r=0;r<8;r++){
    for (let c=0;c<8;c++){
      const el = squareRefs[r][c];
      el.innerHTML = '';
      const sq = rcToSq(r,c, playerSide);
      // координаты
      if (r===7 || c===0){
        const coord = document.createElement('div');
        coord.className = 'coord';
        const file = sq[0], rank = sq[1];
        coord.textContent = (r===7 && c===0) ? `${file}${rank}` : (r===7 ? file : rank);
        el.appendChild(coord);
      }
      // фигуры
      const p = game.get(sq);
      if (!p) continue;
      const d = document.createElement('div');
      d.className = 'piece';
      const inner = document.createElement('div');
      inner.className = 'checker ' + (p.color==='w' ? 'white' : 'black');
      if (p.king){
        const k = document.createElement('span');
        k.className = 'k';
        k.textContent = 'K';
        inner.appendChild(k);
      }
      d.appendChild(inner);
      d.dataset.sq = sq;
      d.dataset.color = p.color;
      d.dataset.king = p.king?'1':'0';
      if (p.color === game.turn() && p.color === playerSide){
        d.addEventListener('pointerdown', (e) => startDrag(e, d, sq));
      }
      el.appendChild(d);
    }
  }
  if (lastMove){
    const a = sqToRC(lastMove.from, playerSide);
    const b = sqToRC(lastMove.to, playerSide);
    getSquareEl(a.r,a.c).classList.add('mark-last');
    getSquareEl(b.r,b.c).classList.add('mark-last');
  }
}
function clearBoardMarks(){
  for (let r=0;r<8;r++){
    for (let c=0;c<8;c++){
      const el = squareRefs[r][c];
      el.classList.remove('mark-legal','mark-target','mark-last');
    }
  }
}

/* ==== DnD ==== */
let dragging = null;
function startDrag(e, pieceEl, fromSq){
  if (aiBusy) return;
  const legal = new Set();
  const moves = game.moves({ square: fromSq });
  if (moves.length===0){
    setStatus('Этой шашкой ходить нельзя (обязательный бой/максимальный бой).');
    return;
  }
  for (const m of moves) legal.add(m.to);
  for (const to of legal){
    const rc = sqToRC(to, playerSide);
    getSquareEl(rc.r, rc.c).classList.add('mark-legal');
  }
  e.preventDefault();
  pieceEl.setPointerCapture(e.pointerId);

  const ghost = document.createElement('div');
  ghost.className = 'dragGhost';
  // рисуем мини-кружок в ghost
  const chk = pieceEl.querySelector('.checker').cloneNode(true);
  chk.style.width='64px'; chk.style.height='64px'; chk.style.borderWidth='3px';
  ghost.appendChild(chk);
  document.body.appendChild(ghost);

  dragging = {
    from: fromSq,
    ghostEl: ghost,
    legalTargets: legal,
    pointerId: e.pointerId,
    lastPos: { x: e.clientX, y: e.clientY }
  };
  updateGhostPosition(e.clientX, e.clientY);

  const onMove = (ev) => {
    dragging.lastPos = { x: ev.clientX, y: ev.clientY };
    updateGhostPosition(ev.clientX, ev.clientY);
    highlightTargetUnder(ev.clientX, ev.clientY);
  };
  const onUp = (ev) => {
    window.removeEventListener('pointermove', onMove);
    pieceEl.releasePointerCapture(dragging.pointerId);
    const dropSq = squareUnder(ev.clientX, ev.clientY);
    const from = dragging.from;
    const ghost = dragging.ghostEl;
    dragging = null;
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    clearBoardMarks();
    if (!dropSq) { setStatus('Отменено.'); return; }
    if (!isLegalTarget(from, dropSq)){
      setStatus('Недопустимый ход.');
      return;
    }
    doPlayerMove(from, dropSq);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp, { once:true });
}
function updateGhostPosition(x,y){
  if (!dragging) return;
  const g = dragging.ghostEl;
  g.style.left = `${x - g.offsetWidth/2}px`;
  g.style.top = `${y - g.offsetHeight/2}px`;
}
function highlightTargetUnder(x,y){
  clearBoardMarks();
  if (dragging){
    for (const to of dragging.legalTargets){
      const rc = sqToRC(to, playerSide);
      getSquareEl(rc.r, rc.c).classList.add('mark-legal');
    }
  }
  const sq = squareUnder(x,y);
  if (!sq) return;
  if (dragging && isLegalTarget(dragging.from, sq)){
    const rc = sqToRC(sq, playerSide);
    getSquareEl(rc.r, rc.c).classList.add('mark-target');
  }
}
function isLegalTarget(from, to){
  const moves = game.moves({ square: from });
  return moves.some(m => m.to === to);
}
function squareUnder(x,y){
  const rect = boardEl.getBoundingClientRect();
  if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) return null;
  const cellW = rect.width / 8;
  const cellH = rect.height / 8;
  let cx = Math.floor((x - rect.left) / cellW);
  let cy = Math.floor((y - rect.top) / cellH);
  cx = Math.max(0, Math.min(7, cx));
  cy = Math.max(0, Math.min(7, cy));
  const sq = rcToSq(cy, cx, playerSide);
  return sq;
}

function doPlayerMove(from, to){
  const mv = game.move({ from, to });
  if (!mv){
    setStatus('Недопустимый ход.');
    renderAll();
    return;
  }
  lastMove = { from: mv.from, to: mv.to };
  saveState();
  renderAll();
  if (checkGameOver()) return;
  aiMoveWithDelay();
}

/* ==== Вспомогательные ==== */
function setStatus(msg){ statusEl.textContent = msg; }
function wireUI(){
  btnNew.addEventListener('click', () => {
    game.reset(); lastMove=null; saveState(); renderAll(); setStatus('Новая партия. Ваш ход.');
    if (game.turn() !== playerSide) aiMoveWithDelay();
  });
  btnUndo.addEventListener('click', () => {
    maeCancel=true;
    if (game.undo()){
      // если после отмены очередь не у игрока — отменим ещё ход (откат хода ИИ)
      if (game.turn() !== playerSide) game.undo();
      saveState(); renderAll(); setStatus('Ход(ы) отменён.');
    }
  });
  btnSwitch.addEventListener('click', () => {
    maeCancel=true;
    playerSide = (playerSide==='w') ? 'b' : 'w';
    saveState(); renderAll();
    if (game.turn() !== playerSide) aiMoveWithDelay();
  });
  selDifficulty.addEventListener('change', () => {
    difficulty = selDifficulty.value; saveState(); renderHUD();
  });
  btnResetStats.addEventListener('click', () => {
    if (confirm('Сбросить всю статистику по сложностям?')){
      score = { easy:{w:0,d:0,l:0}, med:{w:0,d:0,l:0}, mae:{w:0,d:0,l:0} };
      saveScore(); renderHUD();
    }
  });
  modalOk.addEventListener('click', () => { modalGame.classList.remove('open'); btnNew.click(); });
}

/* ==== Геометрия/координаты ==== */
function inBounds(r,c){ return r>=0 && r<8 && c>=0 && c<8; }
function algebraicToRC(sq){
  const file = sq.charCodeAt(0) - 97;
  const rank = parseInt(sq[1],10);
  const r = 8 - rank;
  const c = file;
  return {r,c};
}
function rcToAlgebraic(r,c){
  const file = String.fromCharCode(97 + c);
  const rank = 8 - r;
  return file + rank;
}
function rcToSq(r, c, orientColor){
  if (orientColor === 'w'){
    const file = String.fromCharCode('a'.charCodeAt(0) + c);
    const rank = 8 - r;
    return file + rank;
  } else {
    const file = String.fromCharCode('a'.charCodeAt(0) + (7 - c));
    const rank = r + 1;
    return file + rank;
  }
}
function sqToRC(sq, orientColor){
  const file = sq.charCodeAt(0) - 'a'.charCodeAt(0);
  const rank = parseInt(sq[1], 10);
  if (orientColor === 'w'){
    const r = 8 - rank;
    const c = file;
    return { r, c };
  } else {
    const r = rank - 1;
    const c = 7 - file;
    return { r, c };
  }
}
