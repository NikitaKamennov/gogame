<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Когнитивные замеры — RT, 1-back, Таблица чисел</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161923;
        --panel-2: #1b2030;
        --text: #e8eef2;
        --muted: #9fb0c0;
        --accent: #4dd0e1;
        --accent-2: #7c4dff;
        --good: #66bb6a;
        --warn: #ffa726;
        --bad: #ef5350;
        --btn: #243149;
        --btn-hover: #2d3b58;
        --border: #283044;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(
          1200px 800px at 80% -100px,
          #1b2540 0%,
          var(--bg) 60%
        );
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        line-height: 1.45;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 14px 60px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .title {
        font-size: clamp(20px, 3.2vw, 28px);
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .spacer {
        flex: 1;
      }

      .timer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: linear-gradient(180deg, #1a2131, #141a27);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        box-shadow: var(--shadow);
      }

      .panel {
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        background: linear-gradient(180deg, var(--btn), #1d2840);
        color: var(--text);
        font-weight: 600;
        letter-spacing: 0.2px;
        border: 1px solid var(--border);
        cursor: pointer;
        transition: transform 0.06s ease, background 0.2s ease,
          box-shadow 0.2s ease, border-color 0.2s ease;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        user-select: none;
      }
      button:hover {
        background: var(--btn-hover);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0) scale(0.99);
      }
      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .primary {
        background: linear-gradient(180deg, #2a4268, #24365a);
        border-color: #33517a;
      }
      .primary:hover {
        background: linear-gradient(180deg, #2f4a74, #294067);
      }

      .danger {
        background: linear-gradient(180deg, #5c2a2a, #4a2121);
        border-color: #6e3434;
      }

      .muted {
        background: linear-gradient(180deg, #222735, #1a2030);
        color: var(--muted);
      }

      .hint {
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-top: 14px;
      }

      .grid button {
        aspect-ratio: 1/1;
        font-size: clamp(14px, 4.6vw, 20px);
        font-weight: 700;
        background: linear-gradient(180deg, #1f2a42, #1a2438);
        border-color: #2a3a55;
      }

      .surface {
        width: 100%;
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(180deg, #151a25, #0f141e);
        border: 1px dashed #2b3448;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 320px;
        display: block;
      }

      .status {
        margin-top: 10px;
        color: var(--muted);
        min-height: 20px;
      }

      .section-title {
        font-size: 18px;
        font-weight: 700;
        margin: 16px 0 8px;
      }

      .history {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        margin-top: 10px;
      }

      .card {
        padding: 12px;
        border-radius: 12px;
        background: linear-gradient(180deg, #141a27, #101622);
        border: 1px solid var(--border);
      }

      .kpi {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #121a28;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .good {
        color: var(--good);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }

      .instructions {
        color: var(--muted);
        margin-top: 6px;
      }

      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      @media (max-width: 520px) {
        .controls {
          gap: 8px;
        }
        .timer {
          width: 100%;
          justify-content: space-between;
        }
      }

      /* Modal */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 12px;
      }
      .modal[hidden] {
        display: none;
      }
      .modal-card {
        width: min(760px, 100%);
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px;
        color: var(--text);
        max-height: 90vh;
        overflow: auto;
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .modal-title {
        font-weight: 800;
        font-size: 18px;
      }
      .modal-close {
        margin-left: auto;
      }
      .modal .pill {
        margin-right: 6px;
        margin-top: 6px;
      }
      .modal h4 {
        margin: 12px 0 6px;
        font-size: 16px;
      }
      .modal ul {
        margin: 6px 0 10px 18px;
        padding: 0;
      }
      .modal li {
        margin: 4px 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="title">Когнитивный замер</div>
        <div class="spacer"></div>
        <div class="timer" aria-live="polite">
          <span>Таймер:</span>
          <strong id="timerDisplay">00:00.0</strong>
        </div>
      </header>

      <div class="panel">
        <div class="row">
          <div class="controls">
            <button id="startBtn" class="primary">Запустить тест</button>
            <button id="pauseBtn" class="muted" disabled>Пауза</button>
            <button id="skipBtn" class="muted" disabled>Пропустить</button>
            <button id="stopBtn" class="danger" disabled>Стоп</button>
            <button id="helpBtn" class="muted">
              Расшифровка и как проходить
            </button>
          </div>
          <div class="spacer"></div>
          <div class="hint">
            Все результаты сохраняются локально (LocalStorage). Экспорт — внизу.
          </div>
        </div>

        <div
          id="instructions"
          class="instructions"
          aria-live="polite"
          style="margin-top: 10px">
          Можно проходить сколько угодно раз в течение дня для замеров
          состояния.
        </div>

        <div class="surface" id="surface">
          <canvas
            id="rtCanvas"
            width="900"
            height="300"
            aria-label="Поле теста реакции"
            role="img"></canvas>
          <div
            id="nbackArea"
            style="
              display: none;
              text-align: center;
              width: 100%;
              padding: 16px;
            ">
            <div
              style="font-size: 52px; font-weight: 800; letter-spacing: 2px"
              id="nbackLetter">
              –
            </div>
            <div class="row" style="justify-content: center; margin-top: 12px">
              <button
                id="nbackMatchBtn"
                class="primary"
                style="min-width: 160px">
                Совпало (Space/J)
              </button>
            </div>
          </div>
          <div id="gridArea" style="display: none; width: 100%; padding: 8px">
            <div class="grid" id="grid"></div>
          </div>
        </div>

        <div id="status" class="status">Готов к запуску.</div>
      </div>

      <div class="panel" style="margin-top: 16px">
        <div class="section-title">История замеров</div>
        <div class="row" style="margin-bottom: 8px">
          <div class="controls">
            <button id="exportBtn">Экспорт JSON</button>
            <button id="clearBtn" class="muted">Очистить историю</button>
          </div>
        </div>
        <div class="history" id="history"></div>
      </div>

      <div class="sr-only" aria-live="polite" id="ariaLive"></div>

      <div id="helpModal" class="modal" hidden>
        <div
          class="modal-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="helpModalTitle">
          <div class="modal-head">
            <div id="helpModalTitle" class="modal-title">
              Расшифровка и как проходить
            </div>
            <button id="helpClose" class="muted modal-close">Закрыть</button>
          </div>
          <div id="helpContent">
            <!-- Содержимое заполняется динамически -->
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // ===================== Утилиты =====================

        // Безопасный парс LocalStorage
        function safeParse(json, fallback) {
          try {
            const v = JSON.parse(json);
            return v ?? fallback;
          } catch {
            return fallback;
          }
        }

        function storageGet(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return fallback;
            return safeParse(raw, fallback);
          } catch {
            return fallback;
          }
        }

        function storageSet(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
          } catch {
            return false;
          }
        }

        function nowIso() {
          return new Date().toISOString();
        }

        function clamp(n, a, b) {
          return Math.max(a, Math.min(b, n));
        }

        function fmtMs(ms) {
          const s = Math.floor(ms / 1000);
          const mm = Math.floor(s / 60)
            .toString()
            .padStart(2, "0");
          const ss = (s % 60).toString().padStart(2, "0");
          const d = Math.floor((ms % 1000) / 100);
          return `${mm}:${ss}.${d}`;
        }

        function fmtSec1(ms) {
          return (ms / 1000).toFixed(1) + "s";
        }

        // Криптографический рандом
        function randInt(min, max) {
          // [min, max]
          const range = max - min + 1;
          const buf = new Uint32Array(1);
          if (window.crypto && crypto.getRandomValues) {
            crypto.getRandomValues(buf);
          } else {
            // Фолбэк
            buf[0] = Math.floor(Math.random() * 0xffffffff);
          }
          return min + (buf[0] % range);
        }

        function sample(array) {
          return array[randInt(0, array.length - 1)];
        }

        function shuffle(array) {
          // Фишер-Йетс
          for (let i = array.length - 1; i > 0; i--) {
            const j = randInt(0, i);
            [array[i], array[j]] = [array[j], array[i]];
          }
          return array;
        }

        // Хэш упрощенный для идемпотентности (не крипто)
        function simpleHash(arr) {
          let h = 2166136261 >>> 0;
          for (let i = 0; i < arr.length; i++) {
            h ^= arr[i] + 0x9e3779b9 + (h << 6) + (h >>> 2);
            h >>>= 0;
          }
          return h.toString(16);
        }

        // ===================== Таймер отображения =====================

        const timerDisplay = document.getElementById("timerDisplay");
        const ariaLive = document.getElementById("ariaLive");
        let timerRunning = false;
        let timerStart = 0;
        let timerPausedAt = 0;
        let rafId = 0;

        function timerReset() {
          timerRunning = false;
          timerStart = performance.now();
          timerPausedAt = 0;
          timerDisplay.textContent = "00:00.0";
          cancelAnimationFrame(rafId);
        }

        function timerStartRun() {
          if (timerRunning) return;
          const base = performance.now();
          if (timerPausedAt) {
            // продолжение после паузы
            timerStart += performance.now() - timerPausedAt;
            timerPausedAt = 0;
          } else {
            timerStart = base;
          }
          timerRunning = true;
          const loop = () => {
            if (!timerRunning) return;
            const elapsed = performance.now() - timerStart;
            timerDisplay.textContent = fmtMs(elapsed);
            rafId = requestAnimationFrame(loop);
          };
          rafId = requestAnimationFrame(loop);
        }

        function timerPause() {
          if (!timerRunning) return;
          timerRunning = false;
          timerPausedAt = performance.now();
          cancelAnimationFrame(rafId);
        }

        function timerGetMs() {
          if (!timerRunning) {
            if (timerPausedAt) return timerPausedAt - timerStart;
            return 0;
          }
          return performance.now() - timerStart;
        }

        // ===================== Состояние приложения =====================

        const VERSION = "1.0.0";
        const LS_SESSIONS_KEY = "cogtracker.sessions";
        const LS_RECENT_SEEDS = "cogtracker.recentSeeds";
        const LS_RECENT_PERMS = "cogtracker.recentPerms";

        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const skipBtn = document.getElementById("skipBtn");
        const stopBtn = document.getElementById("stopBtn");

        const instructions = document.getElementById("instructions");
        const statusEl = document.getElementById("status");
        const surface = document.getElementById("surface");

        const rtCanvas = document.getElementById("rtCanvas");
        const nbackArea = document.getElementById("nbackArea");
        const nbackLetter = document.getElementById("nbackLetter");
        const nbackMatchBtn = document.getElementById("nbackMatchBtn");
        const gridArea = document.getElementById("gridArea");
        const gridEl = document.getElementById("grid");

        const exportBtn = document.getElementById("exportBtn");
        const clearBtn = document.getElementById("clearBtn");
        const historyEl = document.getElementById("history");

        const helpBtn = document.getElementById("helpBtn");
        const helpModal = document.getElementById("helpModal");
        const helpClose = document.getElementById("helpClose");
        const helpContent = document.getElementById("helpContent");

        let session = null; // текущая сессия
        let cancelCurrentTest = null; // функция отмены текущего субтеста

        function announce(msg) {
          ariaLive.textContent = msg;
        }

        function setStatus(msg) {
          statusEl.textContent = msg;
        }

        function setInstructions(html) {
          instructions.innerHTML = html;
        }

        function setControlsState({ started, paused }) {
          startBtn.disabled = started;
          pauseBtn.disabled = !started;
          skipBtn.disabled = !started;
          stopBtn.disabled = !started;
          pauseBtn.textContent = paused ? "Продолжить" : "Пауза";
        }

        function showOnly(area) {
          rtCanvas.style.display = area === "rt" ? "block" : "none";
          nbackArea.style.display = area === "nback" ? "block" : "none";
          gridArea.style.display = area === "grid" ? "block" : "none";
        }

        // ===================== Генераторы и анти-повторы =====================

        function getRecentSeeds() {
          return storageGet(LS_RECENT_SEEDS, []);
        }
        function pushRecentSeed(seed) {
          const arr = getRecentSeeds();
          arr.unshift(seed);
          if (arr.length > 10) arr.pop();
          storageSet(LS_RECENT_SEEDS, arr);
        }

        function getRecentPerms() {
          return storageGet(LS_RECENT_PERMS, []);
        }
        function pushRecentPerm(hash) {
          const arr = getRecentPerms();
          arr.unshift(hash);
          if (arr.length > 10) arr.pop();
          storageSet(LS_RECENT_PERMS, arr);
        }

        function uniqueSeed() {
          // Возвращает seed, которого нет в последних 10
          const recent = new Set(getRecentSeeds());
          let seed = "";
          let tries = 0;
          do {
            seed = `${nowIso()}-${randInt(0, 1e9)}`;
            tries++;
            if (tries > 50) break;
          } while (recent.has(seed));
          pushRecentSeed(seed);
          return seed;
        }

        function uniquePermutation(n) {
          // Перестановка 1..n без совпадения с последними (по хэшу)
          const recent = new Set(getRecentPerms());
          for (let attempt = 0; attempt < 50; attempt++) {
            const arr = Array.from({ length: n }, (_, i) => i + 1);
            shuffle(arr);
            const h = simpleHash(arr);
            if (!recent.has(h)) {
              pushRecentPerm(h);
              return arr;
            }
          }
          // если совсем не повезло — вернуть любую
          const arr = Array.from({ length: n }, (_, i) => i + 1);
          return shuffle(arr);
        }

        function gradeIndex(idx) {
          if (idx >= 110)
            return {
              label: "Высокий",
              cls: "good",
              text: "Стабильно высокий уровень работоспособности.",
            };
          if (idx >= 95)
            return {
              label: "Хороший",
              cls: "good",
              text: "Выше среднего. Отличная форма.",
            };
          if (idx >= 75)
            return {
              label: "Норма",
              cls: "warn",
              text: "В пределах нормы. Следите за условиями теста.",
            };
          return {
            label: "Сниженный",
            cls: "bad",
            text: "Ниже обычного. Возможна усталость/стресс/помехи.",
          };
        }

        function gradeRT(medianRt, falseStarts) {
          if (!medianRt)
            return { label: "—", cls: "warn", text: "Недостаточно данных." };
          let base;
          if (medianRt <= 250)
            base = {
              label: "Отлично",
              cls: "good",
              text: "Очень быстрые реакции.",
            };
          else if (medianRt <= 320)
            base = {
              label: "Хорошо",
              cls: "good",
              text: "Хорошая скорость реакции.",
            };
          else if (medianRt <= 450)
            base = {
              label: "Средне",
              cls: "warn",
              text: "Умеренная скорость. Можно лучше.",
            };
          else
            base = {
              label: "Ниже нормы",
              cls: "bad",
              text: "Замедленная реакция.",
            };
          if (falseStarts >= 2) {
            base.text += " Много ложных стартов — контроль импульсивности.";
            if (base.cls === "good") base.cls = "warn";
          }
          return base;
        }

        function gradeNBack(acc, falseAlarms, meanRt) {
          if (acc == null)
            return { label: "—", cls: "warn", text: "Недостаточно данных." };
          let base;
          if (acc >= 0.9)
            base = {
              label: "Отлично",
              cls: "good",
              text: "Высокая точность обновления рабочей памяти.",
            };
          else if (acc >= 0.8)
            base = { label: "Хорошо", cls: "good", text: "Хорошая точность." };
          else if (acc >= 0.65)
            base = {
              label: "Средне",
              cls: "warn",
              text: "Средняя точность — возможна утомляемость.",
            };
          else
            base = {
              label: "Ниже нормы",
              cls: "bad",
              text: "Низкая точность — проверьте условия/потренируйтесь.",
            };

          if (falseAlarms >= 3) {
            base.text += " Много ложных тревог — спешка/невнимательность.";
            if (base.cls === "good") base.cls = "warn";
          }
          if (meanRt && meanRt > 450) {
            base.text +=
              " Время реакции на цели высокое — можно медленнее, но точнее.";
            if (base.cls === "good") base.cls = "warn";
          }
          return base;
        }

        function gradeGrid(totalTimeMs, errors) {
          if (!totalTimeMs)
            return { label: "—", cls: "warn", text: "Недостаточно данных." };
          const s = totalTimeMs / 1000;
          let base;
          if (s <= 35)
            base = {
              label: "Отлично",
              cls: "good",
              text: "Быстрый поиск и переключение внимания.",
            };
          else if (s <= 50)
            base = {
              label: "Хорошо",
              cls: "good",
              text: "Хорошее темпо-ритмическое выполнение.",
            };
          else if (s <= 75)
            base = {
              label: "Средне",
              cls: "warn",
              text: "Среднее время. Можно тренировать концентрацию.",
            };
          else
            base = {
              label: "Ниже нормы",
              cls: "bad",
              text: "Медленно — возможна усталость/отвлечения.",
            };

          if (errors >= 3) {
            base.text += " Много ошибок — не спешите, держите фокус.";
            if (base.cls === "good") base.cls = "warn";
          }
          return base;
        }

        function renderHelpHtml(last) {
          // Блок "Как проходить"
          const how = `
    <h4>Как проходить (лучшие практики)</h4>
    <ul>
      <li><b>Одинаковые условия:</b> тишина, одинаковая поза, экран, освещение. Проходите в одно и то же время суток.</li>

        // ===================== Субтест 1: Реакция (Simple RT) =====================

        async function runRTTest() {
          showOnly("rt");
          setInstructions(
            "Тест реакции: дождитесь появления круга и нажмите/кликните как можно быстрее. 5 попыток. Ранний клик засчитывается как ошибка."
          );
          setStatus("Реакция — готовимся...");
          announce("Начинается тест реакции");

          const ctx = rtCanvas.getContext("2d");
          let width = rtCanvas.width;
          let height = rtCanvas.height;

          function resizeCanvas() {
            // Приспособить плотность пикселей
            const dpr = window.devicePixelRatio || 1;
            const rect = rtCanvas.getBoundingClientRect();
            rtCanvas.width = Math.max(600, Math.floor(rect.width * dpr));
            rtCanvas.height = Math.floor(300 * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = 300;
            drawWaiting();
          }

          function drawWaiting() {
            ctx.clearRect(0, 0, rtCanvas.width, rtCanvas.height);
            ctx.fillStyle = "#0e1420";
            ctx.fillRect(0, 0, rtCanvas.width, rtCanvas.height);
            ctx.fillStyle = "#2b3957";
            ctx.font = "16px system-ui";
            ctx.fillText("Ожидайте сигнал...", 16, 26);
          }

          function drawCircle(color) {
            ctx.clearRect(0, 0, rtCanvas.width, rtCanvas.height);
            ctx.fillStyle = "#0e1420";
            ctx.fillRect(0, 0, rtCanvas.width, rtCanvas.height);
            const r = Math.min(width, height) * 0.12;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
          }

          resizeCanvas();
          window.addEventListener("resize", resizeCanvas, { passive: true });

          const trials = 5;
          const rts = [];
          let falseStarts = 0;
          let cancelled = false;

          // Обработчики ввода
          let responded = false;
          function onInput() {
            if (state === "wait") {
              // Ложный старт
              falseStarts++;
              setStatus(`Слишком рано! Ложный старт: ${falseStarts}`);
              flash("Ложный старт", "#ef5350");
            } else if (state === "go" && !responded) {
              responded = true;
              const rt = performance.now() - goAt;
              rts.push(rt);
              flash(`${Math.round(rt)} ms`, "#66bb6a");
              nextTrial();
            }
          }

          function flash(text, color) {
            // Простая вспышка/подсказка на канвасе
            ctx.save();
            ctx.globalAlpha = 0.95;
            ctx.fillStyle = "#0e1420";
            ctx.fillRect(0, height - 50, width, 50);
            ctx.fillStyle = color;
            ctx.font = "bold 18px system-ui";
            ctx.fillText(text, 16, height - 16);
            ctx.restore();
          }

          let state = "idle"; // idle -> wait -> go
          let goAt = 0;
          let trialIndex = 0;

          function detachInput() {
            rtCanvas.removeEventListener("pointerdown", onInput);
            window.removeEventListener("keydown", keyHandler);
          }
          function attachInput() {
            // Используем pointerdown + Space для моб/desktop
            rtCanvas.addEventListener("pointerdown", onInput, {
              passive: true,
            });
            window.addEventListener("keydown", keyHandler);
          }
          function keyHandler(e) {
            if (e.code === "Space" || e.code === "Enter") {
              e.preventDefault();
              onInput();
            }
          }

          attachInput();

          // Пауза/пропуск/стоп
          cancelCurrentTest = () => {
            cancelled = true;
            detachInput();
            window.removeEventListener("resize", resizeCanvas);
          };

          // Основной цикл попыток
          async function nextTrial() {
            if (cancelled) return;
            trialIndex++;
            if (trialIndex > trials) {
              // закончено
              detachInput();
              window.removeEventListener("resize", resizeCanvas);
              const medianRt = rts.length
                ? rts.slice().sort((a, b) => a - b)[
                    Math.floor((rts.length - 1) / 2)
                  ]
                : 0;
              const metrics = {
                trials,
                correct: rts.length,
                falseStarts,
                medianRt: Math.round(medianRt),
              };
              setStatus(
                `Реакция завершена. Мед. RT: ${metrics.medianRt}ms; Ложные: ${falseStarts}`
              );
              return resolvePromise(metrics);
            }
            // Интервал ожидания перед "go"
            state = "wait";
            responded = false;
            drawWaiting();
            setStatus(`Попытка ${trialIndex} из ${trials}. Ждите сигнал...`);
            const delay = randInt(900, 2500);
            await sleep(delay);
            if (cancelled) return;
            state = "go";
            drawCircle("#4dd0e1");
            goAt = performance.now();
          }

          // Обертка на Promise для результатов
          let resolvePromise, rejectPromise;
          const promise = new Promise((res, rej) => {
            resolvePromise = res;
            rejectPromise = rej;
          });

          function sleep(ms) {
            return new Promise((r) => setTimeout(r, ms));
          }

          // Стартуем первую
          await sleep(400);
          nextTrial();

          return promise;
        }

        // ===================== Субтест 2: 1-back =====================

        async function runNBackTest() {
          showOnly("nback");
          setInstructions(
            "1-back: поток букв. Нажмите “Совпало” (или Space/J), когда текущая буква совпадает с предыдущей. Всего короткая серия (~20 стимулов)."
          );
          setStatus("1-back — готовимся...");
          announce("Начинается тест 1-back");

          const seed = uniqueSeed();
          // Параметры
          const letters = ["A", "B", "C", "D", "E", "H", "K", "M", "T"]; // визуально различимые
          const total = 22;
          const targetRate = 0.3; // ~30% целей
          const isi = 1500; // интервал между стимулами (показ + пауза)
          const showTime = 600; // время отображения буквы
          const stream = [];
          const isTarget = [];

          // Генерация: гарантировано не подряд слишком много целей/не-целей
          // Алгоритм: сначала генерим последовательность букв, потом назначаем цели
          for (let i = 0; i < total; i++) {
            stream.push(sample(letters));
            isTarget.push(false);
          }
          // Устанавливаем цели с ограничениями
          let targets = Math.max(1, Math.round(total * targetRate));
          let i = 1;
          while (targets > 0 && i < total) {
            if (!isTarget[i] && stream[i] === stream[i - 1]) {
              // уже цель по совпадению — засчитаем и продвинемся пропусками
              isTarget[i] = true;
              targets--;
              i += 2;
            } else {
              // попробуем сделать целью — подменим текущую чтобы совпало с предыдущей
              if (randInt(0, 100) < 40) {
                stream[i] = stream[i - 1];
                isTarget[i] = true;
                targets--;
                i += 2;
              } else {
                i++;
              }
            }
          }

          // Метрики
          let hits = 0;
          let misses = 0;
          let falseAlarms = 0;
          const rtOnHits = [];
          let currentIndex = -1;
          let showing = false;
          let cancelled = false;
          let stimShownAt = 0;

          function onMatchPress() {
            if (!showing) return;
            if (isTarget[currentIndex]) {
              hits++;
              const rt = performance.now() - stimShownAt;
              rtOnHits.push(rt);
              flash("Верно", "#66bb6a");
            } else {
              falseAlarms++;
              flash("Ложная тревога", "#ef5350");
            }
          }

          function keyHandler(e) {
            if (e.code === "Space" || e.code === "KeyJ") {
              e.preventDefault();
              onMatchPress();
            }
          }

          function attach() {
            nbackMatchBtn.addEventListener("click", onMatchPress);
            window.addEventListener("keydown", keyHandler);
          }
          function detach() {
            nbackMatchBtn.removeEventListener("click", onMatchPress);
            window.removeEventListener("keydown", keyHandler);
          }

          function flash(text, color) {
            setStatus(`1-back: ${text}`);
            nbackLetter.style.textShadow = `0 0 16px ${color}`;
            setTimeout(() => {
              nbackLetter.style.textShadow = "none";
            }, 220);
          }

          cancelCurrentTest = () => {
            cancelled = true;
            detach();
          };

          attach();
          await sleep(400);

          for (let k = 0; k < total; k++) {
            if (cancelled) break;
            currentIndex = k;
            // Показ буквы
            showing = true;
            nbackLetter.textContent = stream[k];
            stimShownAt = performance.now();
            setStatus(`Стимул ${k + 1}/${total}`);
            await sleep(showTime);
            showing = false;
            // Пауза/межстимульный интервал
            nbackLetter.textContent = "•";
            await sleep(isi - showTime);
          }

          detach();

          // Подсчет пропусков
          for (let k = 0; k < total; k++) {
            if (isTarget[k]) {
              // если по этой позиции не было попадания, считаем пропуск
              // Упростим: сравним hits+misses по количеству целей
            }
          }
          const expectedTargets = isTarget.filter(Boolean).length;
          misses = Math.max(0, expectedTargets - hits);

          const acc = expectedTargets ? hits / expectedTargets : 1;
          const meanRt = rtOnHits.length
            ? Math.round(rtOnHits.reduce((a, b) => a + b, 0) / rtOnHits.length)
            : 0;
          const metrics = {
            total,
            seed,
            expectedTargets,
            hits,
            misses,
            falseAlarms,
            accuracy: acc,
            meanRtOnHits: meanRt,
          };
          setStatus(
            `1-back завершен. Точность: ${
              (acc * 100) | 0
            }%, Попадания: ${hits}/${expectedTargets}, ЛТ: ${falseAlarms}`
          );
          return metrics;

          function sleep(ms) {
            return new Promise((r) => setTimeout(r, ms));
          }
        }

        // ===================== Субтест 3: Таблица чисел 1..25 =====================

        async function runGridTest() {
          showOnly("grid");
          setInstructions(
            "Таблица 5×5 c числами 1..25 (аналог методик Шульте/Анфимова): кликайте по порядку от 1 до 25 как можно быстрее. Считаем общее время и ошибки."
          );
          announce("Начинается тест таблицы чисел");

          const perm = uniquePermutation(25); // массив 1..25 перемешанный
          const hash = simpleHash(perm);

          gridEl.innerHTML = "";
          const buttons = [];
          for (let i = 0; i < 25; i++) {
            const val = perm[i];
            const btn = document.createElement("button");
            btn.textContent = String(val);
            btn.setAttribute("data-val", String(val));
            btn.setAttribute("aria-label", `Число ${val}`);
            gridEl.appendChild(btn);
            buttons.push(btn);
          }

          let next = 1;
          let errors = 0;
          let startAt = 0;
          let finished = false;
          let cancelled = false;

          function onClick(e) {
            const target = e.target.closest("button");
            if (!target) return;
            if (finished) return;

            const val = Number(target.getAttribute("data-val"));
            if (val === next) {
              target.disabled = true;
              target.style.opacity = "0.55";
              target.style.transform = "scale(0.98)";
              if (next === 1) {
                startAt = performance.now();
                setStatus("Таблица: пошли!");
              }
              next++;
              if (next > 25) {
                finished = true;
                detach();
                const totalTimeMs = performance.now() - startAt;
                const metrics = {
                  permutationHash: hash,
                  totalTimeMs: Math.round(totalTimeMs),
                  errors,
                };
                setStatus(
                  `Таблица завершена за ${fmtSec1(
                    totalTimeMs
                  )}. Ошибки: ${errors}`
                );
                resolvePromise(metrics);
              }
            } else {
              errors++;
              target.style.animation = "shake .2s";
              setTimeout(() => {
                target.style.animation = "none";
              }, 240);
              setStatus(`Неправильно. Ошибки: ${errors}`);
            }
          }

          function attach() {
            gridEl.addEventListener("click", onClick);
          }
          function detach() {
            gridEl.removeEventListener("click", onClick);
          }

          cancelCurrentTest = () => {
            cancelled = true;
            detach();
          };

          attach();

          // Не нужен отдельный промис ожидания, кроме результата
          let resolvePromise, rejectPromise;
          const promise = new Promise((res, rej) => {
            resolvePromise = res;
            rejectPromise = rej;
          });

          return promise;
        }

        // ===================== Композитный индекс =====================

        function computeIndex(rt, nb, grid) {
          // Индекс 0..150. Пытаемся сохранять направление "лучше=больше".
          // Правила грубой нормировки (адаптируйте под себя):
          // - RT: 100 * (400 / medianRT) в пределах [20..150]
          const rtScore =
            rt && rt.medianRt > 0
              ? clamp(100 * (400 / rt.medianRt), 20, 150) - rt.falseStarts * 2
              : 50;
          // - 1-back: базово accuracy*100, штраф за false alarms, бонус за скорость попаданий
          const nbBase = nb ? nb.accuracy * 100 : 50;
          const nbRtBonus =
            nb && nb.meanRtOnHits > 0
              ? clamp(40 * (350 / nb.meanRtOnHits), 0, 40)
              : 0;
          const nbScore = clamp(
            nbBase + nbRtBonus - nb.falseAlarms * 3,
            20,
            150
          );
          // - Grid: 100*(60s / t), чем быстрее, тем лучше
          const gScore =
            grid && grid.totalTimeMs > 0
              ? clamp(100 * (60000 / grid.totalTimeMs), 20, 150) -
                grid.errors * 2
              : 50;

          const index = (rtScore + nbScore + gScore) / 3;
          return clamp(Math.round(index), 0, 150);
        }

        // ===================== Движок сессии =====================

        async function runSession() {
          // Инициализация
          session = {
            id: `${Date.now()}-${randInt(0, 1e6)}`,
            version: VERSION,
            startedAt: nowIso(),
            finishedAt: null,
            device: {
              ua: navigator.userAgent,
              platform: navigator.platform,
              dpr: window.devicePixelRatio || 1,
            },
            tests: [],
          };

          setControlsState({ started: true, paused: false });
          timerReset();
          timerStartRun();

          // Последовательно запускаем три субтеста
          try {
            // 1) Реакция
            setStatus("Подготовка теста реакции...");
            const rt = await runRTTest();
            session.tests.push({ type: "rt", metrics: rt });

            await smallBreak("Небольшая пауза (2s) перед 1-back...");
            // 2) 1-back
            const nb = await runNBackTest();
            session.tests.push({ type: "nback", metrics: nb });

            await smallBreak("Пауза (2s) перед таблицей чисел...");
            // 3) Таблица чисел
            const gd = await runGridTest();
            session.tests.push({ type: "grid", metrics: gd });

            // Финал
            session.finishedAt = nowIso();
            const rtM = session.tests.find((t) => t.type === "rt")?.metrics;
            const nbM = session.tests.find((t) => t.type === "nback")?.metrics;
            const gdM = session.tests.find((t) => t.type === "grid")?.metrics;
            session.index = computeIndex(rtM, nbM, gdM);

            saveSession(session);
            setStatus(
              `Сессия завершена. Индекс: ${session.index}. Результаты сохранены в LocalStorage.`
            );
            announce("Сессия завершена");
            renderHistory();
          } catch (e) {
            setStatus("Сессия прервана.");
          } finally {
            // Сброс UI
            timerPause();
            setControlsState({ started: false, paused: false });
            showOnly(null);
            session = null;
            cancelCurrentTest = null;
          }

          async function smallBreak(text) {
            setStatus(text);
            await new Promise((r) => setTimeout(r, 2000));
          }
        }

        // ===================== Обработчики верхних кнопок =====================

        startBtn.addEventListener("click", () => {
          if (session) return;
          setInstructions(
            "Идут задания. Можно поставить на паузу или пропустить текущий субтест."
          );
          runSession();
        });

        pauseBtn.addEventListener("click", () => {
          if (!session) return;
          if (timerRunning) {
            timerPause();
            setControlsState({ started: true, paused: true });
            setStatus("Пауза.");
            announce("Пауза");
          } else {
            timerStartRun();
            setControlsState({ started: true, paused: false });
            setStatus("Продолжили.");
            announce("Продолжили");
          }
        });

        skipBtn.addEventListener("click", () => {
          if (!session || !cancelCurrentTest) return;
          setStatus("Текущий субтест пропущен.");
          cancelCurrentTest();
          // Небольшой хак: перейти к следующему шагу — реализация через резолвы внутри каждого теста
          // RT/1-back/GRID реализованы так, что отмена прерывает их промисы корректно только там, где это предусмотрено.
          // Чтобы не застрять, перезапустим следующую фазу в зависимости от того, где мы были — упрощенно:
          // Здесь оставим как "user пропустил" — тест завершается и двигаемся далее в runSession по await.
        });

        stopBtn.addEventListener("click", () => {
          if (!session) return;
          if (cancelCurrentTest) cancelCurrentTest();
          timerPause();
          setControlsState({ started: false, paused: false });
          setStatus("Сессия остановлена.");
          showOnly(null);
          session = null;
          cancelCurrentTest = null;
        });

        exportBtn.addEventListener("click", exportSessions);
        clearBtn.addEventListener("click", clearHistory);

        // ===================== Инициализация =====================

        renderHistory();
        setStatus("Готов к запуску.");

        // ===================== Дополнительно: стили анимации (JS-in-CSS) =====================
        const style = document.createElement("style");
        style.textContent = `
      @keyframes shake {
        0% { transform: translateX(0) }
        25% { transform: translateX(-3px) }
        50% { transform: translateX(3px) }
        75% { transform: translateX(-2px) }
        100% { transform: translateX(0) }
      }`;
        document.head.appendChild(style);
      })();
    </script>
  </body>
</html>
