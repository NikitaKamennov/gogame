<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Typing Trainer (EN/RU)</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      /* Базовая типографика и сетка */
      :root {
        --bg: #0f1216;
        --panel: #151a21;
        --text: #c9ced6; /* было #e5e7eb — сделал сероватым */
        --muted: #9aa3af;
        --ok: #22c55e;
        --err: #ef4444;
        --accent: #60a5fa;
        --current: #f59e0b;
        --border: #242b35;
        --focus: #334155;
        --shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }
      .wrap {
        max-width: 1100px;
        margin: 24px auto;
        padding: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row + .row {
        margin-top: 12px;
      }
      label {
        font-size: 14px;
        color: var(--muted);
      }
      select,
      textarea,
      input[type="text"],
      button {
        background: #0e131a;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      select:focus,
      textarea:focus,
      input[type="text"]:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(51, 65, 85, 0.4);
      }
      button {
        cursor: pointer;
        background: #111827;
        border: 1px solid var(--border);
      }
      button.primary {
        background: #1f2937;
        border-color: #374151;
      }
      button:hover {
        filter: brightness(1.05);
      }

      /* Ввод */
      #typingInput {
        width: 100%;
        font-family: var(--mono);
        font-size: 22px;
        line-height: 1.5;
      }

      /* Отображение целевой строки */
      .targetBox {
        margin-top: 8px;
        background: #0e131a;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        overflow: auto; /* прокрутка содержимого */
        max-height: 600px; /* верхний предел, чтобы помощник не уходил за вьюпорт */
      }
      .lineLabel {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .targetLine {
        font-family: var(--mono);
        font-size: 22px;
        line-height: 1.6; /* фиксируем для стабильной геометрии строк */
        white-space: pre-wrap;
        word-break: break-word;
      }
      .typed {
        color: var(--ok);
      }
      .current {
        color: var(--current);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .rest {
        color: var(--muted);
      }

      .nextLine {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--border);
        font-family: var(--mono);
        font-size: 16px;
        color: #8b949e;
        white-space: pre-wrap;
      }

      #customText {
        width: 100%;
      }

      /* Flash ошибки — теперь выводится в строке статистики */
      .flashErr {
        display: inline-block;
        padding: 0px 0px;
        border-radius: 0px;
        background: rgba(239, 68, 68, 0.1);
        color: var(--err);
        border: 1px solid rgba(239, 68, 68, 0.35);
        animation: fadeOut 2s ease forwards;
      }
      @keyframes fadeOut {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-3px);
        }
      }

      /* Сообщения */
      .msg {
        margin-top: 10px;
        font-size: 14px;
        color: #a7f3d0;
      }
      .msg.warn {
        color: #fde68a;
      }
      .msg.err {
        color: #fecaca;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .modeTabs {
        display: inline-flex;
        background: #0e131a;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .modeTabs button {
        border: none;
        background: transparent;
        padding: 10px 14px;
        font-weight: 600;
        color: var(--muted);
      }
      .modeTabs button.active {
        color: var(--text);
        background: #111827;
      }

      /* Единственная колонка — весь контент центрируется и тянется на ширину .panel */
      .split {
        display: block;
      }

      /* Подсказки */
      .help {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }

      /* === Keyboard Assistant === */
      .kbAssistant {
        margin-top: 10px;
        position: relative;
        background: #0e131a;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .kbHeader {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .kb {
        position: relative;
      }
      .kbRows {
        display: grid;
        gap: 6px;
      }
      .kbRow {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .kbKey {
        min-width: 36px;
        height: 40px;
        padding: 0 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #111827;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 14px;
        user-select: none;
        opacity: 0.95;
      }
      .kbKey.space {
        min-width: 260px;
        justify-content: center;
      }
      .kbKey.highlight {
        background: rgba(96, 165, 250, 0.15);
        border-color: #60a5fa;
        box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.25) inset,
          0 0 12px rgba(96, 165, 250, 0.25);
      }

      /* Руки — PNG-спрайт (10 кадров по горизонтали) */
      #hands {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 0;
        pointer-events: none;
        z-index: 5;
      }
      #hands .hand {
        display: none;
        position: absolute;
        background-image: url("/static/hands2.png");
        background-repeat: no-repeat;
        will-change: transform, left, top, background-position;
      }
      #hands .hand.active {
        display: block;
      }

      /* Переключатель */
      .switch {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .switch input {
        accent-color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <div class="row controls">
          <div class="modeTabs" role="tablist" aria-label="Режим">
            <button
              id="tabLesson"
              class="active"
              role="tab"
              aria-selected="true">
              Английский
            </button>
            <button id="tabLessonRU" role="tab" aria-selected="false">
              Русский
            </button>
            <button id="tabCustom" role="tab" aria-selected="false">
              Свой текст
            </button>
          </div>
          <div class="row" id="lessonControls" style="margin: 0">
            <label for="lessonSelect">Урок:</label>
            <select id="lessonSelect"></select>
            <button
              id="resetProgress"
              title="Сбросить прогресс"
              class="primary">
              Сброс прогресса
            </button>
          </div>
          <div class="row" id="customControls" style="display: none; margin: 0">
            <label for="customText">Текст:</label>
            <button id="loadCustom" class="primary">Старт</button>
          </div>
          <div class="row" id="errorControls" style="margin: 0">
            <label
              for="errorLimitSelect"
              title="Сколько ошибок можно допустить в строке до перезапуска строки"
              >Лимит ошибок:</label
            >
            <select id="errorLimitSelect"></select>
          </div>
        </div>

        <div class="split" style="margin-top: 12px">
          <div>
            <label for="typingInput">Ввод</label>
            <input
              id="typingInput"
              type="text"
              lang="en"
              autocomplete="off"
              spellcheck="false"
              placeholder="Фокус на поле и печатайте..." />
            <div class="targetBox">
              <div class="lineLabel" id="lineInfo">Строка</div>
              <div class="targetLine" id="targetLine">
                <!-- .typed / .current / .rest -->
              </div>
              <div class="nextLine" id="nextLine"></div>
            </div>

            <!-- Статистика + ошибка в одной строке -->
            <div class="row" id="stats" style="margin-top: 6px">
              <label>Статистика:</label>
              <span id="statStreak" title="Текущая серия без ошибок"
                >Серия: 0</span
              >
              <span id="statErrors" title="Ошибки в текущей строке по лимиту"
                >Ошибки: 0/3</span
              >
              <span id="statFlash" aria-live="polite"></span>
            </div>

            <!-- Ассистент: контейнер всегда виден -->
            <div class="kbAssistant" id="kbAssistant">
              <div class="kbHeader">
                <label class="switch" title="Показать/скрыть клавиатуру и руки">
                  <input type="checkbox" id="toggleAssistant" />
                  Клавиатура‑помощник
                </label>
                <span id="kbLegend" style="color: #9aa3af"
                  >Подсвечивается нужная клавиша и палец</span
                >
              </div>
              <div class="kb" id="kb">
                <div id="hands">
                  <div class="hand lhand" id="lhand4"></div>
                  <div class="hand lhand" id="lhand3"></div>
                  <div class="hand lhand" id="lhand2"></div>
                  <div class="hand lhand" id="lhand1"></div>
                  <div class="hand lhand" id="lhand0"></div>
                  <div class="hand rhand" id="rhand0"></div>
                  <div class="hand rhand" id="rhand1"></div>
                  <div class="hand rhand" id="rhand2"></div>
                  <div class="hand rhand" id="rhand3"></div>
                  <div class="hand rhand" id="rhand4"></div>
                </div>
                <div class="kbRows" id="kbRows"></div>
              </div>
            </div>

            <div class="msg" id="message"></div>

            <div class="help">
              Подсказки: - Backspace разрешён для исправления. -
              <span id="errorLimitInfo"></span> ошибок в строке — повтор строки
              с начала. -
              <span id="helpAllowed"
                >Вводится только нижний регистр a-z, цифры, пробел и базовая
                пунктуация.</span
              >
            </div>
          </div>

          <div id="customBox" style="display: none; margin-top: 12px">
            <label for="customText">Свой текст (по строкам):</label>
            <textarea
              id="customText"
              rows="12"
              placeholder="Каждая строка — отдельное упражнение. Пример:
hello world
type this line
and this one"></textarea>
          </div>
        </div>
      </div>
    </div>

        hard: { ru: "Хард", en: "Hard" },
        hardd: { ru: "Хард 500", en: "Hard 500" },
        harddd: { ru: "Хард 1000", en: "Hard 1000" },
        hardpro: { ru: "Хард Pro", en: "Hard Pro" },
      };

      function collectNeuroWords(lang = "en") {
        const src = lang === "ru" ? curriculumRU : curriculumEN;
        const idsEN = new Set([
          "words-advanced",
          "paragraphs",
          "paragraphs-advanced",
          "paragraphs-advanced1",
          "paragraphs-advanced2",
        ]);
        const idsRU = new Set([
          "words-advanced-ru",
          "paragraphs",
          "paragraphs-advanced-ru1",
          "paragraphs-advanced-ru2",
          "paragraphs-advanced-ru3",
          "paragraphs-advanced-ru4",
          "paragraphs-advanced-ru",
        ]);
        const allowIds = lang === "ru" ? idsRU : idsEN;
        const lines = [];
        for (const l of src) {
          if (!l || !l.id || !Array.isArray(l.lines)) continue;
          if (allowIds.has(l.id)) lines.push(...l.lines);
        }
        const words = [];
        const wordRe = lang === "ru" ? /[а-яё0-9]+/gi : /[a-z0-9]+/gi;
        for (const ln of lines) {
          const found = (ln || "").toLowerCase().match(wordRe);
          if (found && found.length) words.push(...found);
        }
        return words;
      }
      function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }
      function generateNeuroLine(lang = "en", kind = "light") {
        const need = NEURO[kind] || NEURO.light;
        const dict = collectNeuroWords(lang);
        if (!dict.length)
          return lang === "ru"
            ? "нет данных для нейро‑генерации"
            : "no data for neuro generation";
        const out = [];
        for (let i = 0; i < need; i++) out.push(pickRandom(dict));
        return out.join(" ");
      }

      // ===============================
      // Состояние
      // ===============================
      const LS_KEYS = {
        mode: "tt_mode",
        lessonIndex: "tt_lesson_idx",
        lineIndex: "tt_line_idx",
        ruLessonIndex: "tt_ru_lesson_idx",
        ruLineIndex: "tt_ru_line_idx",
        enNeuro: "tt_en_neuro",
        ruNeuro: "tt_ru_neuro",
        enNeuroLine: "",
        ruNeuroLine: "",
        customLines: "tt_custom_lines",
        errorLimit: "tt_error_limit",
        currentStreak: "tt_current_streak",
        showAssistant: "tt_show_assistant",
        customLang: "tt_custom_lang",
      };
      let state = {
        mode: "lesson",
        lessonIndex: 0,
        lineIndex: 0,
        ruLessonIndex: 0,
        ruLineIndex: 0,
        charIndex: 0,
        enNeuro: "",
        ruNeuro: "",
        errorsInLine: 0,
        customLines: [],
        errorLimit: 3,
        currentStreak: 0,
        showAssistant: false,
        customLang: "en",
        visualWrapLines: 1,
        visualLineStartIndex: 0,

      };

      // ===============================
      // DOM
      // ===============================
      const typingInput = document.getElementById("typingInput");
      const targetLineEl = document.getElementById("targetLine");
      const nextLineEl = document.getElementById("nextLine");
      const messageEl = document.getElementById("message");
      const lineInfo = document.getElementById("lineInfo");

      const tabLesson = document.getElementById("tabLesson");
      const tabLessonRU = document.getElementById("tabLessonRU");
      const tabCustom = document.getElementById("tabCustom");

      const lessonSelect = document.getElementById("lessonSelect");
      const resetBtn = document.getElementById("resetProgress");
      const customControls = document.getElementById("customControls");
      const lessonControls = document.getElementById("lessonControls");

      const customBox = document.getElementById("customBox");
      const customText = document.getElementById("customText");
      const loadCustomBtn = document.getElementById("loadCustom");

      const errorLimitSelect = document.getElementById("errorLimitSelect");
      const errorLimitInfo = document.getElementById("errorLimitInfo");
      const helpAllowed = document.getElementById("helpAllowed");

      const statStreak = document.getElementById("statStreak");
      const statErrors = document.getElementById("statErrors");
      const statFlash = document.getElementById("statFlash");

      const kbAssistant = document.getElementById("kbAssistant");
      const toggleAssistant = document.getElementById("toggleAssistant");
      const kbRows = document.getElementById("kbRows");
      const kbEl = document.getElementById("kb");
      const targetBoxEl = document.querySelector(".targetBox");
      const handsEl = document.getElementById("hands");
      const handEls = {
        l4: document.getElementById("lhand4"),
        l3: document.getElementById("lhand3"),
        l2: document.getElementById("lhand2"),
        l1: document.getElementById("lhand1"),
        l0: document.getElementById("lhand0"),
        r0: document.getElementById("rhand0"),
        r1: document.getElementById("rhand1"),
        r2: document.getElementById("rhand2"),
        r3: document.getElementById("rhand3"),
        r4: document.getElementById("rhand4"),
      };

      // ===============================
      // Спрайт рук
      // ===============================
      const SPRITE_URL = "/static/hands2.png";
      const HAND_SCALE = 0.72;
      const spriteMeta = {
        loaded: false,
        width: 0,
        height: 0,
        frameW: 0,
        frameH: 0,
      };
      const FINGER_TO_FRAME = {
        l4: 0,
        l3: 1,
        l2: 2,
        l1: 3,
        l0: 4,
        r0: 5,
        r1: 6,
        r2: 7,
        r3: 8,

      };

      // ===============================
      // Инициализация
      // ===============================
      init();
      async function init() {
        await loadHandsSprite();

        // Заполнить лимит ошибок 0..30
        errorLimitSelect.innerHTML = "";
        for (let i = 0; i <= 30; i++) {
          const opt = document.createElement("option");
          opt.value = String(i);
          opt.textContent = String(i);
          errorLimitSelect.appendChild(opt);
        }
        const opt999 = document.createElement("option");
        opt999.value = "999";
        opt999.textContent = "999";
        errorLimitSelect.appendChild(opt999);

        loadProgress();

        // События вкладок
        tabLesson.addEventListener("click", () => setMode("lesson"));
        tabLessonRU.addEventListener("click", () => setMode("ru"));

        lessonSelect.addEventListener("change", onLessonChange);
        resetBtn.addEventListener("click", resetProgress);
        loadCustomBtn.addEventListener("click", loadCustomText);

        typingInput.addEventListener("keydown", onKeyDown);
        typingInput.addEventListener("paste", (e) => e.preventDefault());

        errorLimitSelect.addEventListener("change", onErrorLimitChange);

        toggleAssistant.addEventListener("change", () => {
          state.showAssistant = !!toggleAssistant.checked;
          saveProgress();
          updateAssistantVisibility();
          updateKeyboardHints();
        });

        window.addEventListener("resize", () => {
          updateTargetBoxHeight();
          if (state.showAssistant) updateKeyboardHints();
        });

        toggleAssistant.checked = !!state.showAssistant;

        // UI — первичное применение
        updateModeUI(true);
        updateTargetBoxHeight();
        errorLimitSelect.value = String(state.errorLimit ?? 3);
        updateErrorLimitInfo();
        updateStats();
        ensureFocus();
        render();
      }

      function ensureFocus() {
        setTimeout(() => typingInput.focus(), 0);
      }

      // ===============================
      // Загрузка спрайта
      // ===============================
      function loadHandsSprite() {
        return new Promise((resolve) => {
          const img = new Image();
          img.src = SPRITE_URL;
          img.onload = () => {
            spriteMeta.loaded = true;
            spriteMeta.width = img.naturalWidth || img.width;
            spriteMeta.height = img.naturalHeight || img.height;
            spriteMeta.frameW = Math.round(spriteMeta.width / 10);
            spriteMeta.frameH = spriteMeta.height;
            setupHandSprites();
            updateKeyboardHints();
            resolve();
          };
          img.onerror = () => resolve();
        });
      }
      function setupHandSprites() {
        if (!spriteMeta.loaded) return;
        Object.values(handEls).forEach((el) => {
          if (!el) return;
          el.style.backgroundImage = `url('${SPRITE_URL}')`;
          el.style.backgroundRepeat = "no-repeat";
          el.style.width = `${spriteMeta.frameW}px`;
          el.style.height = `${spriteMeta.frameH}px`;
          el.style.transformOrigin = "top left";
          el.style.transform = `scale(${HAND_SCALE})`;
        });
      }
      function setHandFrame(el, frameIndex) {
        if (!el || !spriteMeta.loaded) return;
        const offsetX = -(frameIndex * spriteMeta.frameW);
        el.style.backgroundPosition = `${offsetX}px 0px`;
      }

      // ===============================
      // Режимы и прогресс
      // ===============================
      function setMode(mode) {
        if (mode !== "lesson" && mode !== "ru" && mode !== "custom") return;
        state.mode = mode;

        // Сброс позиции в начале новой сессии
        state.charIndex = 0;
        state.errorsInLine = 0;
        state.visualWrapLines = 1;
        state.visualLineStartIndex = 0;
        state.visualRowIndex = 0;

        if (mode === "lesson") {
          state.ruNeuro = "";
          state.ruNeuroLine = "";
        }
        if (mode === "ru") {
          state.enNeuro = "";
          state.enNeuroLine = "";
        }

        updateModeUI();
        saveProgress();
        render();
        ensureFocus();
      }

      function updateModeUI(initial = false) {
        // Tabs
        tabLesson.classList.toggle("active", state.mode === "lesson");
        tabLessonRU.classList.toggle("active", state.mode === "ru");
        tabCustom.classList.toggle("active", state.mode === "custom");

        tabLesson.setAttribute(
          "aria-selected",
          String(state.mode === "lesson")
        );
        tabLessonRU.setAttribute("aria-selected", String(state.mode === "ru"));
        tabCustom.setAttribute(
          "aria-selected",
          String(state.mode === "custom")
        );

        const isLesson = state.mode === "lesson" || state.mode === "ru";
        lessonControls.style.display = isLesson ? "flex" : "none";
        customControls.style.display =
          state.mode === "custom" ? "flex" : "none";
        customBox.style.display = state.mode === "custom" ? "block" : "none";

        // Input lang + help текст
        const isRU = isRULayout();
        typingInput.setAttribute("lang", isRU ? "ru" : "en");
        helpAllowed.textContent = isRU
          ? "Вводится только нижний регистр а-я, ё, цифры, пробел и базовая пунктуация."
          : "Вводится только нижний регистр a-z, цифры, пробел и базовая пунктуация.";

        // Наполнить список уроков ...
        populateLessonSelect();

        // Выставить значение select ...
        if (state.mode === "ru") {
          lessonSelect.value = state.ruNeuro
            ? `neuro:${state.ruNeuro}`
            : String(state.ruLessonIndex);
        } else {
          lessonSelect.value = state.enNeuro
            ? `neuro:${state.enNeuro}`
            : String(state.lessonIndex);
        }

        // + Пересобрать клавиатуру с учетом customLang
        buildKeyboard(isRU ? "ru" : "en");

        updateAssistantVisibility();
        if (!initial) updateKeyboardHints();
      }

      function populateLessonSelect() {
        const isRU = state.mode === "ru";
        const list = isRU ? curriculumRU : curriculumEN;
        lessonSelect.innerHTML = "";

        // Обычные уроки
        list.forEach((l, idx) => {
          const opt = document.createElement("option");
          opt.value = String(idx);
          opt.textContent = `${idx + 1}. ${l.title}`;
          lessonSelect.appendChild(opt);
        });

        // Добавляем два "псевдо‑урока"
        Object.entries(NEURO).forEach(([kind, size]) => {
          const opt = document.createElement("option");
          opt.value = `neuro:${kind}`;

          const title = isRU
            ? `Нейро ${NEURO_LABELS[kind]?.ru ?? kind} (${size} слов)`
            : `Neuro ${NEURO_LABELS[kind]?.en ?? kind} (${size} words)`;

          opt.textContent = title;
          lessonSelect.appendChild(opt);
        });
      }

      function onLessonChange() {
        const v = lessonSelect.value || "";
        const isNeuro = v.startsWith("neuro:");
        const kind = isNeuro ? v.split(":")[1] : "";

        if (state.mode === "ru") {
          if (isNeuro) {
            state.ruNeuro = kind === "hard" ? "hard" : "light";
            state.ruNeuroLine = "";
          } else {
            state.ruNeuro = "";
            state.ruLessonIndex = Number(v) || 0;
            state.ruLineIndex = 0;
            state.ruNeuroLine = "";
          }
        } else {
          if (isNeuro) {
            state.enNeuro = kind === "hard" ? "hard" : "light";
            state.enNeuroLine = "";
          } else {
            state.enNeuro = "";
            state.lessonIndex = Number(v) || 0;
            state.lineIndex = 0;
            state.enNeuroLine = "";
          }
        }

        state.charIndex = 0;
        state.errorsInLine = 0;
        state.visualWrapLines = 1;
        state.visualLineStartIndex = 0;
        state.visualRowIndex = 0;

        saveProgress();
        render();
        ensureFocus();
      }

      function resetProgress() {
        if (!confirm("Сбросить прогресс обучения для текущего режима?")) return;

        if (state.mode === "ru") {
          state.ruLessonIndex = 0;
          state.ruLineIndex = 0;
          state.ruNeuroLine = "";
        } else {
          state.lessonIndex = 0;
          state.lineIndex = 0;
          state.enNeuroLine = "";
        }

        state.charIndex = 0;
        state.errorsInLine = 0;
        state.visualWrapLines = 1;
        state.visualLineStartIndex = 0;
        state.visualRowIndex = 0;
        state.currentStreak = 0;

        saveProgress();
        lessonSelect.value = "0";
        flashMessage("Прогресс сброшен", "warn");
        updateStats();
        render();
        ensureFocus();
      }

      function loadCustomText() {
        const text = (customText.value || "").replace(/\r/g, "");
        const lines = text
          .split("\n")
          .map((s) => s.trim())
          .filter(Boolean);
        if (!lines.length) {
          flashMessage("Введите строки в «Свой текст».", "err");
          return;
        }
        state.customLines = lines;
        state.customLang = detectCustomLang(text);
        state.lineIndex = 0;
        state.charIndex = 0;
        state.errorsInLine = 0;
        state.visualWrapLines = 1;
        state.visualLineStartIndex = 0;
        state.visualRowIndex = 0;

        setMode("custom");
        saveCustomToLS(lines);
        saveProgress();
        render();
        ensureFocus();
      }

      function getLinesForMode() {
        if (state.mode === "lesson") {
          if (state.enNeuro) {
            if (!state.enNeuroLine) {
              state.enNeuroLine = generateNeuroLine("en", state.enNeuro);
            }
            return [state.enNeuroLine];
          }
          const lesson = curriculumEN[state.lessonIndex] || curriculumEN[0];
          return Array.isArray(lesson?.lines) ? lesson.lines : [];
        }
        if (state.mode === "ru") {
          if (state.ruNeuro) {
            if (!state.ruNeuroLine) {
              state.ruNeuroLine = generateNeuroLine("ru", state.ruNeuro);
            }
            return [state.ruNeuroLine];
          }
          const lesson = curriculumRU[state.ruLessonIndex] || curriculumRU[0];
          return Array.isArray(lesson?.lines) ? lesson.lines : [];
        }
        return state.customLines || [];
      }

      // ===============================
      // Рендер
      // ===============================
      function render() {
        const srcLines = getLinesForMode();
        if (!srcLines.length) {
          targetLineEl.innerHTML = `<span class="typed" id="typedSpan"></span><span id="typedMarker"></span><span class="rest"></span>`;
          typingInput.value = "";
          nextLineEl.textContent = "";
          lineInfo.textContent = "Строка";
          updateErrorLimitInfo();
          updateStats();
          updateKeyboardHints();
          return;
        }

        // Текущие индексы
        if (state.mode === "ru") {
          if (state.ruLineIndex >= srcLines.length)
            state.ruLineIndex = srcLines.length - 1;
        } else if (state.mode === "lesson") {
          if (state.lineIndex >= srcLines.length)
            state.lineIndex = srcLines.length - 1;
        }

        const curLineIndex =
          state.mode === "ru"
            ? state.ruLineIndex
            : state.mode === "lesson"
            ? state.lineIndex
            : state.lineIndex;

        const line = normalizeLine(srcLines[curLineIndex]);
        const typed = line.slice(0, state.charIndex);
        const currentChar = line[state.charIndex] ?? "";
        const rest = line.slice(state.charIndex + (currentChar ? 1 : 0));

        lineInfo.textContent = `Строка ${curLineIndex + 1} из ${
          srcLines.length
        }`;

        const typedHtml = escapeHtml(typed);
        const currentHtml = currentChar
          ? `<span class="current">${escapeHtml(currentChar)}</span>`
          : "";
        const restHtml = escapeHtml(rest);

        targetLineEl.innerHTML = `<span class="typed" id="typedSpan">${typedHtml}</span><span id="typedMarker"></span>${currentHtml}<span class="rest">${restHtml}</span>`;

        // Рассчитываем индекс текущей визуальной строки по позиции маркера
        const marker = document.getElementById("typedMarker");
        let currentRow = 0;
        if (marker) {
          const baseRect = targetLineEl.getBoundingClientRect();
          const mRect = marker.getBoundingClientRect();
          const lh = getLineHeightPx();
          const delta = mRect.top - baseRect.top;
          // FIX: стабилизируем вычисление строки — без дрожания на границах
          currentRow = Math.max(0, Math.floor(delta / lh + 0.01));
        }

        // Гард: переход на новую визуальную строку
        if (state.charIndex === 0) {
          state.visualRowIndex = 0;
          state.visualLineStartIndex = 0;
        } else if (currentRow > (state.visualRowIndex || 0)) {
          state.visualRowIndex = currentRow;
          // Если перенос распознан "с опозданием" (после ввода первого символа новой строки),
          // включаем этот символ в новый сегмент (кроме случая с пробелом).
          const includePrev =
            state.lastTypedChar && state.lastTypedChar !== " ";
          const base = state.charIndex - (includePrev ? 1 : 0);
          state.visualLineStartIndex = Math.max(base, 0);

          // Сбрасываем, чтобы следующее определение переноса не использовало старое значение.
          state.lastTypedChar = "";
        }

        // Вводим в input только часть текущей видимой строки
        const typedSince = line.slice(
          state.visualLineStartIndex,
          state.charIndex
        );
        typingInput.value = typedSince;

        // Удерживаем высоту окна и ставим текущую строку вверху
        updateTargetBoxHeight();
        centerCurrentRow(); // теперь выравнивание по верхней строке

        const next = srcLines[curLineIndex + 1];
        nextLineEl.textContent = next ? `Следующая: ${next}` : "";

        if (state.charIndex > 0) messageEl.textContent = "";
        updateErrorLimitInfo();
        updateStats();
        updateKeyboardHints();
      }

      // ===============================
      // Ввод
      // ===============================
      function onKeyDown(e) {
        const srcLines = getLinesForMode();
        if (!srcLines.length) return;

        if (e.key === "Tab" || e.key === "Escape") {
          e.preventDefault();
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          return;
        }
        if (
          e.key === "ArrowLeft" ||
          e.key === "ArrowRight" ||
          e.key === "ArrowUp" ||
          e.key === "ArrowDown" ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey
        ) {
          return;
        }

        const curLineIndex =
          state.mode === "ru"
            ? state.ruLineIndex
            : state.mode === "lesson"
            ? state.lineIndex
            : state.lineIndex;
        const lineRaw = srcLines[curLineIndex] || "";
        const line = normalizeLine(lineRaw);

        if (e.key === "Backspace") {
          e.preventDefault();
          if (state.charIndex > 0) {
            state.charIndex -= 1;
            typingInput.value = line.slice(
              state.visualLineStartIndex,
              state.charIndex
            );
            render();
          }
          return;
        }

        const ch = toTrainerChar(e.key);
        if (!ch) {
          if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            e.preventDefault();
            registerError(e.key);
            return;
          }
          e.preventDefault();
          return;
        }

        const expected = line[state.charIndex] || "";
        if (expected === "") {
          e.preventDefault();
          return;
        }
        e.preventDefault();

        if (ch === expected) {
          state.charIndex += 1;
          state.lastTypedChar = ch; // NEW: запоминаем последний введённый символ

          state.currentStreak = (state.currentStreak || 0) + 1;
          updateStats();
          saveProgress();
          if (state.charIndex >= line.length) {
            onLineCompleted();
          } else {
            render();
          }
        } else {
          registerError(ch);
        }
      }

      function onLineCompleted() {
        state.charIndex = 0;
        state.visualWrapLines = 1;
        state.visualLineStartIndex = 0;
        state.visualRowIndex = 0;

        const srcLines = getLinesForMode();

        // Нейро‑режим: перегенерируем следующую строку
        if (
          (state.mode === "lesson" && state.enNeuro) ||
          (state.mode === "ru" && state.ruNeuro)
        ) {
          if (state.mode === "lesson") {
            state.enNeuroLine = "";
          } else {
            state.ruNeuroLine = "";
          }
          state.errorsInLine = 0;
          saveProgress();
          render();
          return;
        }

        // Перейти к следующей строке
        if (state.mode === "ru") {
          state.ruLineIndex += 1;
          state.errorsInLine = 0;
          const lessonLines =
            (curriculumRU[state.ruLessonIndex] || {}).lines || [];
          if (state.ruLineIndex >= lessonLines.length) {
            state.ruLessonIndex += 1;
            state.ruLineIndex = 0;
            if (
              state.ruLessonIndex >= curriculumRU.length &&
              curriculumRU.length > 0
            ) {
              state.ruLessonIndex = curriculumRU.length - 1;
              state.ruLineIndex =
                curriculumRU[state.ruLessonIndex].lines.length - 1 || 0;
              flashMessage("Программа на русском завершена.", "warn");
            } else if (curriculumRU.length > 0) {
              flashMessage(
                `Урок «${curriculumRU[state.ruLessonIndex].title}»`,
                "warn"
              );
            }
            lessonSelect.value = String(state.ruLessonIndex);
          }
        } else if (state.mode === "lesson") {
          state.lineIndex += 1;
          state.errorsInLine = 0;
          const lessonLines =
            (curriculumEN[state.lessonIndex] || {}).lines || [];
          if (state.lineIndex >= lessonLines.length) {
            state.lessonIndex += 1;
            state.lineIndex = 0;
            if (
              state.lessonIndex >= curriculumEN.length &&
              curriculumEN.length > 0
            ) {
              state.lessonIndex = curriculumEN.length - 1;
              state.lineIndex =
                curriculumEN[state.lessonIndex].lines.length - 1 || 0;
              flashMessage(
                "Программа обучения завершена. Можно повторять или перейти к «Свой текст».",
                "warn"
              );
            } else if (curriculumEN.length > 0) {
              flashMessage(
                `Урок «${curriculumEN[state.lessonIndex].title}»`,
                "warn"
              );
            }
            lessonSelect.value = String(state.lessonIndex);
          }
        } else {
          // custom
          state.lineIndex += 1;
          state.errorsInLine = 0;
          if (state.lineIndex >= srcLines.length) {
            state.lineIndex = srcLines.length - 1;
            flashMessage("Все строки из «Свой текст» набраны.", "warn");
          }
        }

        saveProgress();
        render();
      }

      function resetCurrentLineWithMessage(msg) {
        state.charIndex = 0;
        state.errorsInLine = 0;
        state.visualWrapLines = 1;
        state.visualLineStartIndex = 0;
        state.visualRowIndex = 0;
        typingInput.value = "";
        flashMessage(msg, "err");
        render();
      }

      // ===============================
      // Flash/сообщения/статистика
      // ===============================
      let flashTimer = null;
      function showFlashError(ch) {
        clearTimeout(flashTimer);
        if (statFlash) {
          statFlash.innerHTML = `<span class="flashErr">Ошибка: ${escapeHtml(
            ch
          )}</span>`;
          flashTimer = setTimeout(() => {
            statFlash.innerHTML = "";
          }, 2000);
        }
      }
      function flashMessage(text, type = "") {
        messageEl.textContent = text;
        messageEl.classList.remove("warn", "err");
        if (type) messageEl.classList.add(type);
      }
      function updateStats() {
        if (statStreak)
          statStreak.textContent = `Серия: ${state.currentStreak || 0}`;
        if (statErrors)
          statErrors.textContent = `Ошибки: ${state.errorsInLine || 0}/${
            state.errorLimit || 0
          }`;
      }
      function registerError(displayCh) {
        state.errorsInLine += 1;
        state.currentStreak = 0;
        showFlashError(displayCh);
        saveProgress();
        updateStats();
        if (state.errorsInLine > state.errorLimit) {
          resetCurrentLineWithMessage("Слишком много ошибок. Повторим строку.");
        } else {
          render();
        }
      }
      function onErrorLimitChange() {
        const v = Number(errorLimitSelect.value);
        const normalized = normalizeErrorLimit(Number.isFinite(v) ? v : 3);
        state.errorLimit = normalized;
        saveProgress();
        updateErrorLimitInfo();
        updateStats();
        ensureFocus();
      }
      function updateErrorLimitInfo() {
        if (errorLimitInfo)
          errorLimitInfo.textContent = String(state.errorLimit);
      }

      // ===============================
      // Утилиты
      // ===============================
      function normalizeLine(s) {
        return (s || "").toLowerCase();
      }
      function detectCustomLang(text) {
        return /[а-яё]/i.test(text) ? "ru" : "en";
      }
      function isRULayout() {
        return (
          state.mode === "ru" ||
          (state.mode === "custom" && state.customLang === "ru")
        );
      }
      function normalizeErrorLimit(v) {
        return v === 999 ? 999 : clamp(v, 0, 30);
      }
      function toTrainerChar(key) {
        if (key === " ") return " ";
        if (key.length === 1) {
          const ch = key.toLowerCase();
          const useRU = isRULayout();
          if (useRU) {
            if (/[а-яё0-9\.\,;\'\/\-\=\`]/i.test(ch)) return ch;
          } else {
            if (/[a-z0-9\.\,;\'\/\-\=\`]/.test(ch)) return ch;
          }
        }
        return "";
      }
      function escapeHtml(s) {
        return (s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }
      function getLineHeightPx() {
        const cs = getComputedStyle(targetLineEl);
        let lh = parseFloat(cs.lineHeight);
        if (!Number.isFinite(lh)) {
          const fs = parseFloat(cs.fontSize) || 22;
          lh = Math.round(fs * 1.6);
        }
        return lh;
      }
      function updateTargetBoxHeight() {
        if (!targetBoxEl) return;
        const lh = getLineHeightPx();
        const five = lh * 5; // 5 строк
        const h = Math.min(600, five); // не выше 600px
        targetBoxEl.style.height = `${Math.round(h)}px`;
        targetBoxEl.style.overflow = "auto";
      }
      function centerCurrentRow() {
        if (!targetBoxEl) return;
        const marker = document.getElementById("typedMarker");
        if (!marker) return;

        const boxRect = targetBoxEl.getBoundingClientRect();
        const markRect = marker.getBoundingClientRect();
        const relativeTop = markRect.top - boxRect.top + targetBoxEl.scrollTop;
        const lh = getLineHeightPx();

        // FIX: выравниваем так, чтобы текущая визуальная строка была ВЕРХНЕЙ
        const currentRow = Math.max(0, Math.floor(relativeTop / lh + 0.01));
        const desiredTop = currentRow * lh;

        const maxTop = targetBoxEl.scrollHeight - targetBoxEl.clientHeight;
        targetBoxEl.scrollTop = clamp(desiredTop, 0, Math.max(0, maxTop));
      }

      // ===============================
      // Сохранение/загрузка прогресса
      // ===============================
      function saveProgress() {
        try {
          localStorage.setItem(LS_KEYS.mode, state.mode);
          localStorage.setItem(LS_KEYS.errorLimit, String(state.errorLimit));
          localStorage.setItem(
            LS_KEYS.currentStreak,
            String(state.currentStreak || 0)
          );
          localStorage.setItem(
            LS_KEYS.showAssistant,
            state.showAssistant ? "1" : "0"
          );
          // EN
          localStorage.setItem(LS_KEYS.lessonIndex, String(state.lessonIndex));
          localStorage.setItem(LS_KEYS.lineIndex, String(state.lineIndex));
          // RU
          localStorage.setItem(
            LS_KEYS.ruLessonIndex,
            String(state.ruLessonIndex)
          );
          localStorage.setItem(LS_KEYS.ruLineIndex, String(state.ruLineIndex));
          localStorage.setItem(LS_KEYS.enNeuro, state.enNeuro || "");
          localStorage.setItem(LS_KEYS.ruNeuro, state.ruNeuro || "");
          // + custom lang
          localStorage.setItem(LS_KEYS.customLang, state.customLang || "en");
          if (state.mode === "custom" && state.customLines.length) {
            saveCustomToLS(state.customLines);
          }
        } catch {}
      }
      function loadProgress() {
        try {
          const mode = localStorage.getItem(LS_KEYS.mode);
          if (mode === "custom" || mode === "lesson" || mode === "ru")
            state.mode = mode;

          const errLimit = Number(localStorage.getItem(LS_KEYS.errorLimit));
          if (!Number.isNaN(errLimit))
            state.errorLimit = clamp(errLimit, 0, 30);

          const curStreak = Number(localStorage.getItem(LS_KEYS.currentStreak));
          if (!Number.isNaN(curStreak))
            state.currentStreak = Math.max(0, curStreak);

          const showAssistantRaw = localStorage.getItem(LS_KEYS.showAssistant);
          state.showAssistant = showAssistantRaw === "1";

          // EN progress
          const lessonIndex = Number(localStorage.getItem(LS_KEYS.lessonIndex));
          const lineIndex = Number(localStorage.getItem(LS_KEYS.lineIndex));
          if (!Number.isNaN(lessonIndex))
            state.lessonIndex = Math.max(0, lessonIndex);
          if (!Number.isNaN(lineIndex))
            state.lineIndex = Math.max(0, lineIndex);

          // RU progress
          const ruLessonIndex = Number(
            localStorage.getItem(LS_KEYS.ruLessonIndex)
          );
          const ruLineIndex = Number(localStorage.getItem(LS_KEYS.ruLineIndex));
          if (!Number.isNaN(ruLessonIndex))
            state.ruLessonIndex = Math.max(0, ruLessonIndex);
          if (!Number.isNaN(ruLineIndex))
            state.ruLineIndex = Math.max(0, ruLineIndex);

          const enNeuro = localStorage.getItem(LS_KEYS.enNeuro);
          if (enNeuro === "light" || enNeuro === "hard" || enNeuro === "")
            state.enNeuro = enNeuro || "";

          const ruNeuro = localStorage.getItem(LS_KEYS.ruNeuro);
          if (ruNeuro === "light" || ruNeuro === "hard" || ruNeuro === "")
            state.ruNeuro = ruNeuro || "";

          state.customLines = loadCustomFromLS();

          const cl = localStorage.getItem(LS_KEYS.customLang);
          if (cl === "ru" || cl === "en") state.customLang = cl;
        } catch {}
      }
      function saveCustomToLS(lines) {
        try {
          localStorage.setItem(
            LS_KEYS.customLines,
            JSON.stringify(lines || [])
          );
        } catch {}
      }
      function loadCustomFromLS() {
        try {
          const raw = localStorage.getItem(LS_KEYS.customLines);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      // ===============================
      // Ассистент: видимость, клавиатура, подсветка
      // ===============================
      function updateAssistantVisibility() {
        kbAssistant.style.display = "";
        const kbBody = kbAssistant.querySelector(".kb");
        if (kbBody) kbBody.style.display = state.showAssistant ? "" : "none";
        if (handsEl) handsEl.style.display = state.showAssistant ? "" : "none";
      }
      function buildKeyboard(layout = "en") {
        kbRows.innerHTML = "";
        const rowsEN = [
          "`1234567890-=",
          "qwertyuiop",
          "asdfghjkl;'",
          "zxcvbnm,./",
        ];
        const rowsRU = [
          "ё1234567890-=",
          "йцукенгшщзхъ",
          "фывапролджэ",
          "ячсмитьбю.",
        ];
        const rows = layout === "ru" ? rowsRU : rowsEN;
        rows.forEach((rowStr) => {
          const row = document.createElement("div");
          row.className = "kbRow";
          for (const raw of rowStr) {
            const ch = raw.toLowerCase();
            const key = document.createElement("div");
            key.className = "kbKey";
            key.dataset.key = ch;
            if (/[a-zа-яё]/i.test(raw)) {
              key.textContent = raw.toUpperCase();
            } else {
              key.textContent = raw;
            }
            row.appendChild(key);
          }
          kbRows.appendChild(row);
        });
        const spaceRow = document.createElement("div");
        spaceRow.className = "kbRow";
        const spaceKey = document.createElement("div");
        spaceKey.className = "kbKey space";
        spaceKey.dataset.key = " ";
        spaceKey.textContent = layout === "ru" ? "Пробел" : "Space";
        spaceRow.appendChild(spaceKey);
        kbRows.appendChild(spaceRow);
      }
      function getKeyElForChar(ch) {
        if (!kbEl || !ch) return null;
        const allowedEN = /^[a-z0-9 \.\,;\'\/\-\=\`]$/;
        const allowedRU = /^[а-яё0-9 \.\,;\'\/\-\=\`]$/i;
        const allowed = isRULayout() ? allowedRU : allowedEN;
        if (!allowed.test(ch)) return null;
        const selector =
          ch === " " ? '[data-key=" "]' : `[data-key="${cssEscape(ch)}"]`;
        return kbEl.querySelector(selector);
      }
      function highlightKey(ch) {
        if (!kbEl) return null;
        kbEl
          .querySelectorAll(".kbKey.highlight")
          .forEach((el) => el.classList.remove("highlight"));
        if (!ch) return null;
        const keyEl = getKeyElForChar(ch);
        if (keyEl) keyEl.classList.add("highlight");
        return keyEl;
      }
      function updateKeyboardHints() {
        updateAssistantVisibility();
        if (!state.showAssistant) return;
        const expected = getExpectedChar();
        const keyEl = highlightKey(expected);
        const finger = getFingerForChar(expected);
        updateHandsHighlightAtKey(finger, keyEl);
      }
      function getExpectedChar() {
        const srcLines = getLinesForMode();
        if (!srcLines.length) return "";
        const curLineIndex =
          state.mode === "ru"
            ? state.ruLineIndex
            : state.mode === "lesson"
            ? state.lineIndex
            : state.lineIndex;
        const line = normalizeLine(srcLines[curLineIndex] || "");
        return line[state.charIndex] || "";
      }
      function updateHandsHighlightAtKey(code, keyEl) {
        Object.values(handEls).forEach((el) => {
          if (!el) return;
          el.classList.remove("active");
        });
        if (!code || !keyEl || !spriteMeta.loaded) return;

        const kbRect = kbEl.getBoundingClientRect();
        const keyRect = keyEl.getBoundingClientRect();
        const centerX = keyRect.left + keyRect.width / 2 - kbRect.left;
        const topY = keyRect.bottom - kbRect.top + 8;
        const scaledW = spriteMeta.frameW * HAND_SCALE;

        function place(codeKey, xLeft, yTop) {
          const el = handEls[codeKey];
          if (!el) return;
          const frameIdx = FINGER_TO_FRAME[codeKey];
          setHandFrame(el, frameIdx);
          el.style.left = `${Math.round(xLeft)}px`;
          el.style.top = `${Math.round(yTop)}px`;
          el.classList.add("active");
        }

        if (code === "thumbs") {
          const spaceEl = getKeyElForChar(" ") || keyEl;
          const sRect = spaceEl.getBoundingClientRect();
          const sCenter = sRect.left + sRect.width / 2 - kbRect.left;
          const y = sRect.bottom - kbRect.top + 8;
          const offset = Math.max(28, Math.min(60, sRect.width * 0.22));
          place("l0", sCenter - offset - scaledW / 2, y);
          place("r0", sCenter + offset - scaledW / 2, y);
          return;
        }
        place(code, centerX - scaledW / 2, topY);
      }
      function getFingerForChar(ch) {
        if (!ch) return "";
        if (ch === " ") return "thumbs";
        return isRULayout() ? getFingerForCharRU(ch) : getFingerForCharEN(ch);
      }
      function getFingerForCharEN(ch) {
        const L4 = new Set(["`", "1", "q", "a", "z"]);
        const L3 = new Set(["2", "w", "s", "x"]);
        const L2 = new Set(["3", "e", "d", "c"]);
        const L1 = new Set(["4", "5", "r", "t", "f", "g", "v", "b"]);
        const R1 = new Set(["6", "7", "y", "u", "h", "j", "n", "m"]);
        const R2 = new Set(["8", "i", "k", ","]);
        const R3 = new Set(["9", "o", "l", "."]);
        const R4 = new Set(["0", "-", "=", "p", ";", "'", "/"]);
        const c = ch;
        if (L4.has(c)) return "l4";
        if (L3.has(c)) return "l3";
        if (L2.has(c)) return "l2";
        if (L1.has(c)) return "l1";
        if (R1.has(c)) return "r1";
        if (R2.has(c)) return "r2";
        if (R3.has(c)) return "r3";
        if (R4.has(c)) return "r4";
        return "";
      }
      function getFingerForCharRU(ch) {
        const L4 = new Set(["ё", "1", "й", "ф", "я"]);
        const L3 = new Set(["2", "ц", "ы", "ч"]);
        const L2 = new Set(["3", "у", "в", "с"]);
        const L1 = new Set(["4", "5", "к", "е", "а", "п", "м", "и"]);
        const R1 = new Set(["6", "7", "г", "ш", "р", "о", "т", "ь", "н", "б"]);
        const R2 = new Set(["8", "щ", "л", "д", "ю"]);
        const R3 = new Set(["9", "з", "ж", "э", "."]);
        const R4 = new Set(["0", "-", "=", "х", "ъ"]);
        const c = ch;
        if (L4.has(c)) return "l4";
        if (L3.has(c)) return "l3";
        if (L2.has(c)) return "l2";
        if (L1.has(c)) return "l1";
        if (R1.has(c)) return "r1";
        if (R2.has(c)) return "r2";
        if (R3.has(c)) return "r3";
        if (R4.has(c)) return "r4";
        return "";
      }
      function cssEscape(ch) {
        return ch.replace(/([\\`'"])/g, "\\$1");
      }
    </script>
  </body>
</html>
